<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Rhoback — Logo Library</title>
<style>
/* Same look as the Embroidery Portal / live portal: Admiral Navy, Old Glory Red, #E8ECF0 lines, Futura PT headings, Aptos body. */
:root{--navy:#29304E;--navy-h:#49516C;--red:#BF2033;--line:#E8ECF0;--bg:#FAFAFA;--text:#29304E;--grey:#6B7B8D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Aptos","Segoe UI",sans-serif;font-size:14px;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
h1,.brand-sub,.sec-head .name,.top-bar,.emb-box-title{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic","Futura",sans-serif}
.top-bar{background:var(--navy);color:#fff;font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:10px 24px;text-align:center}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);gap:12px;background:#fff;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:16px}
.brand{font-size:20px;font-weight:700;letter-spacing:3px;color:var(--navy)}
.ridge{display:flex}.ridge span{width:4px;height:36px}.ridge .r{background:var(--red)}.ridge .n{background:var(--navy)}
.brand-sub{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--navy)}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header-user{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--navy)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.msearch{position:relative}
.msearch input{width:260px;padding:7px 28px 7px 12px;border:1px solid var(--line);border-radius:18px;font:inherit;font-size:13px;color:var(--navy);background:#fff}
.msearch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--grey);font-size:16px;cursor:pointer;padding:0 4px}
.vbadge{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--grey);border:1px solid var(--line);border-radius:10px;padding:3px 9px;background:#fff}
.savepill{font:inherit;font-size:12px;font-weight:600;border-radius:14px;padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.savepill.ok{color:#2e7d32;border-color:#c5e5cb;background:#f1faf2}
.savepill.warn{color:#7a5800;border-color:#f0d58a;background:#fff8e1}
.savepill.err{color:#a61b1b;border-color:#f3c4c4;background:#fdecec}
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;overflow-x:auto}
.tab{padding:14px 24px;font:inherit;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--navy)}.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab .tcnt{font-size:11px;font-weight:600;letter-spacing:0;margin-left:6px;color:var(--grey)}
.page{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
h1{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--navy);background:#fff}
.bar .count{font-size:13px;color:var(--grey);margin-left:auto}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.btn:hover{background:var(--navy-h);border-color:var(--navy-h)}
.btn.light{background:#fff;color:var(--navy);border-color:var(--line)}.btn.light:hover{background:var(--bg)}
.btn.small{padding:5px 12px;font-size:12px}
.bar .btn{padding:6px 14px;font-size:12px}
.lnk{border:none;background:none;color:var(--navy);font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0}
/* sections */
.sec{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;cursor:pointer;user-select:none}
.sec-head .chev{width:14px;font-size:12px;color:var(--navy)}
.sec-head .name{font-size:16px;font-weight:700;color:var(--navy)}
.sec-head .cnt{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:#F0F2F7;color:var(--grey)}
/* tables (emb-list look) */
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tbl th{background:#fff;font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--grey);text-align:left;border-bottom:2px solid var(--navy);padding:12px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th.nos{cursor:default;padding-left:4px;padding-right:4px;letter-spacing:.3px;text-overflow:clip}
.tbl th .arr{font-size:10px;margin-left:3px;color:#B5BCC8}.tbl th.sorted{color:var(--navy)}.tbl th.sorted .arr{color:var(--navy)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#F8F9FC}.tbl tr.row.open td{background:#F3F5FA}
.tbl .chev{color:var(--grey);font-size:11px}
.emb{font-weight:600;color:var(--navy)}.sch{display:block;font-size:11px;color:#49516C;margin-top:2px;font-weight:400}
.th{width:48px;height:48px;border-radius:4px;border:1px solid var(--line);background:#F7F8FB;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#C2C8D2;font-size:11px}
.th img{width:100%;height:100%;object-fit:contain;background:#fff}
.ft{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin:1px 3px 1px 0}
.ft.on{background:#eaf6ec;color:#256b31}.ft.off{background:#F3F4F6;color:#A0A7B3;text-decoration:line-through}
.stp{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;background:#eef0f6;color:var(--navy);margin:0 4px 3px 0}.stp.ok{background:#eaf6ec;color:#256b31}.stp.no{background:#fff1e6;color:#9a4b00}.stp.off{background:#F3F4F6;color:#6B7385}
.stt{display:flex;flex-wrap:wrap;gap:2px 0}
.nl{font-size:11.5px;color:#6B7385;line-height:1.4;margin-top:1px}.nl .nr{color:#b3261e;font-weight:600}.nl .nf{color:#8a5a00;font-weight:600}   /* LL v1.35 */
.tdt{display:inline-block;font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px;margin:1px 3px 1px 0;background:#eef0f6;color:#49516C}
.flag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;background:#fdf0c4;color:#7a5800}
.chk-bad{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:#f8d7d7;color:#a61b1b;margin-left:4px}
.muted{color:#A0A7B3}
.empty{background:#fff;border:1px dashed #d6dbe4;border-radius:8px;padding:18px;text-align:center;color:var(--grey);font-size:13px}
.tblwrap .empty{border:none;text-align:left;padding:14px 16px}
.done-btn{font:inherit;font-size:12px;font-weight:600;color:#256b31;background:#eaf6ec;border:1px solid #c5e5cb;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.done-btn:hover{border-color:#256b31}
/* connect screen */
.connect{max-width:620px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:28px;text-align:center}
.connect h2{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic",sans-serif;color:var(--navy);font-size:20px;margin-bottom:10px}
.connect p{color:#49516C;font-size:14px;line-height:1.55;margin-bottom:16px}
/* logo card (emb-card look) */
.card-cell{padding:0!important;background:#FAFAFA!important;cursor:default}
.emb-card{padding:14px 14px 14px 30px}
.emb-card-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.emb-card-cols{grid-template-columns:1fr}.emb-card{padding-left:14px}}
.emb-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.emb-box{background:#fff;border:1px solid var(--line);border-radius:8px}
.emb-box-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.emb-box-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.emb-box-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--navy)}
.emb-box-right{margin-left:auto;font-size:12px;color:var(--grey);font-weight:600}
.emb-box-bd{padding:12px}
.emb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.emb-grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.emb-fld{min-width:0}.emb-fld.full{grid-column:1 / -1}
.emb-fld>label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.emb-card input:not([type=checkbox]):not([type=file]),.emb-card select,.emb-card textarea,.af input,.af select,.school-top input,.school-top textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--navy);background:#fff}
.emb-card textarea,.school-top textarea{min-height:56px;resize:vertical}
.emb-val{font-size:13px;color:var(--navy);padding:6px 0}
.cb{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;color:var(--navy)}
.cb input{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.cbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.cbs.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pic{text-align:center}
.pic .lbl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:4px}
.pic .big{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#F7F8FB;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#B5BCC8;font-size:12px}
.pic .big img{width:100%;height:100%;object-fit:contain;background:#fff}
[data-pop]{cursor:zoom-in}
/* LL v1.06: school page (info, colors, past colors) */
.school-top{margin-bottom:22px}
.ctbl{width:100%;border-collapse:collapse;font-size:13px}
.ctbl th{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);text-align:left;padding:0 6px 6px 0}
.ctbl td{padding:3px 6px 3px 0;vertical-align:middle}
.ctbl td.x{width:28px;text-align:right}
.ctbl input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--navy);background:#fff}
.xbtn{border:none;background:none;color:var(--grey);font-size:17px;cursor:pointer;padding:0 4px}.xbtn:hover{color:var(--red)}
.past{border-top:1px solid #EEF0F4;padding:8px 0}.past:first-child{border-top:none;padding-top:0}
.past-h{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.past-c{font-size:12.5px;color:#49516C;line-height:1.6}
/* LL v1.04: Accounts tab, Archive / Retire / Restore / Delete */
.back{background:none;border:none;color:var(--navy);font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;padding:0}
.tbl tr.acct-row{cursor:pointer}.tbl tr.acct-row:hover td{background:#F8F9FC}
.emb-card-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px}
.emb-card-foot .foot-note{font-size:12px;font-weight:700;color:#7a5800;background:#fdf0c4;border-radius:10px;padding:3px 10px;margin-right:auto}
.emb-btn-del{background:#fff;border:1px solid var(--red);color:var(--red);padding:5px 12px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.emb-btn-del:hover{background:#fdecec}
/* LL v1.03: approved logos stand out (Status = Approved, or Approved (Box) checked) */
.crop-wrap{display:flex;justify-content:center;background:#F3F4F6;border-radius:6px;padding:8px}
#cropC{max-width:100%;cursor:crosshair;touch-action:none}
.crop-acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}.crop-acts .note{margin:0 auto 0 0}
.sewpill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;background:#fdecea;color:#b3261e;margin:1px 4px 1px 0;white-space:nowrap;line-height:1.25;text-align:center}
.tbl tr.row.needsew>td:first-child{box-shadow:inset 4px 0 0 #c62828}   /* LL v1.21: needs a sew-out */
.apill{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;background:#eaf6ec;color:#256b31;margin:1px 4px 1px 0;white-space:nowrap}
/* LL v1.02: History on each logo + Audit tab */
.emb-hist summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--navy);user-select:none}
.emb-hist-row{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:8px;padding:6px 0;border-bottom:1px solid #EEF0F4;font-size:12.5px}
.emb-hist-row:last-child{border-bottom:none}
.emb-hist-date{color:var(--grey)}.emb-hist-by{color:#49516C;text-align:right}
.emb-hist-list{margin-top:8px}
.ch-from{color:#8A93A3;text-decoration:line-through}.ch-arr{color:var(--grey);margin:0 4px}
.bar input[type=search],.bar input[type=date]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--navy);background:#fff}
.bar input[type=search]{min-width:260px}
.bar .dlbl{font-size:12px;color:var(--grey);display:inline-flex;align-items:center;gap:6px}
.tbl tr.aud-row{cursor:pointer}.tbl tr.aud-row:hover td{background:#F8F9FC}
/* LL v1.01: click a picture to see it bigger */
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,24,40,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.lb[hidden]{display:none}
.lb-box{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:14px 16px 16px;max-width:min(92vw,900px);max-height:92vh;display:flex;flex-direction:column;gap:10px}
.lb-hd{display:flex;align-items:center;gap:10px}
.lb-t{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic",sans-serif;font-size:15px;font-weight:700;color:var(--navy)}
.lb-s{font-size:12px;color:var(--grey)}
.lb-x{margin-left:auto;border:none;background:none;font-size:26px;line-height:1;color:var(--grey);cursor:pointer;padding:0 4px}.lb-x:hover{color:var(--navy)}
.lb-img{display:flex;align-items:center;justify-content:center;min-width:min(80vw,600px);min-height:min(60vh,600px);background:#fff}
.lb-img img{width:min(80vw,600px);height:min(70vh,600px);object-fit:contain}
.th.over{outline:2px dashed var(--red);outline-offset:1px;background:var(--bg)}
.pic .big.over{border:2px dashed var(--red);background:var(--bg)}
.pic .fn{font-size:11px;color:#49516C;margin-top:3px;overflow-wrap:anywhere;min-height:14px}
.pic .acts{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap}.pic .acts .btn{white-space:nowrap}   /* LL v1.24: Replace / Remove / Crop never squished */
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer;padding:0}.ibtn:hover{background:#F3F5FA}.ibtn.del:hover{color:#b3261e;border-color:#e8b4b0;background:#fdecea}
.lks{display:flex;flex-wrap:wrap;gap:4px 14px}.lk{display:inline-flex;align-items:center;gap:3px;font-size:13px}.lk a{color:#1d4f91;font-weight:600;text-decoration:none}.lk a:hover{text-decoration:underline}
.lkx{border:none;background:none;cursor:pointer;color:#9aa3b5;font-size:12px;padding:0 2px}.lkx:hover{color:var(--navy)}
.pathrow a.btn{flex:none;white-space:nowrap;text-decoration:none}
.ccdrop{border:1.5px dashed #c9cfdb;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#49516C;background:#fbfbfd}.ccdrop.over{border-color:var(--red);background:var(--bg)}
.ckc{font-weight:800;font-size:13px;text-align:center;border-radius:4px;padding:3px 0}.ckc.ok{color:#256b31;background:#eaf6ec}.ckc.bad{color:#b3261e;background:#fdecea}.ckc.warn{color:#8a5a00;background:#fff4e0}.ckc.off{color:#9aa3b5}
.clist{border-collapse:collapse;margin:0 0 12px;background:#fff;font-size:12px}
.clist th{padding:5px 10px;border:1px solid var(--line);background:#F0F2F7;color:var(--navy);font-weight:700;font-size:11px;white-space:nowrap}
.clist td{padding:4px 10px;border:1px solid var(--line);text-align:center;font-weight:800;font-size:14px}
.clist td.ok{color:#256b31;background:#eaf6ec}.clist td.bad{color:#b3261e;background:#fdecea}.clist td.warn{color:#8a5a00;background:#fff4e0}.clist td.off{color:#9aa3b5;background:#fafafa}
.needs{display:grid;grid-template-columns:repeat(3,max-content);gap:4px 22px}.needs .cb{display:inline-flex}
.pathrow{display:flex;gap:6px;align-items:center}
/* LL v1.08: internal notes (like the portals) + To Do dropdown */
.inote{padding:6px 0;border-bottom:1px solid #EEF0F4;font-size:13px;white-space:pre-wrap;word-break:break-word}
.inote:last-child{border-bottom:none}
.inote .when{display:block;color:var(--grey);font-size:11.5px;white-space:normal}
.inote-list{max-height:260px;overflow:auto}
.inote-add{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.inote-add textarea{flex:1;min-width:0;min-height:54px}
.inote-add .btn{flex:none;white-space:nowrap}
.todo-tc{margin-top:10px}
/* LL v1.09: Box drive uploads (version + date) */
.boxsec{margin-top:12px;padding-top:10px;border-top:1px solid #EEF0F4}
.boxsec-h{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.ctbl input[type=date]{padding:5px 7px}
.ft.box{background:#e8f0fb;color:#1d4f91}
/* LL v1.10: Barrett + QD sew-outs, compare side by side */
.pics.p2{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}
.lb-cmp{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.lb-cmp figure{margin:0;text-align:center;flex:1 1 0;min-width:220px}
.lb-cmp figcaption{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.lb-cmp img{width:100%;max-width:440px;height:min(62vh,440px);object-fit:contain;background:#fff}
.lb-box.wide{max-width:min(96vw,1400px)}
/* LL v1.11 (temporary): Setup Check tab */
.chk-bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chk-scope{display:flex;gap:6px;align-items:center;margin:0 0 8px}.chk-scope button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;color:var(--navy)}.chk-scope button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chk-bar .who{font-size:18px;font-weight:700;color:var(--navy);margin-right:6px}
.chk-bar .sub{font-size:12px;color:var(--grey)}
.chk-bar .sp{flex:1}
.chk-prog{height:6px;background:#EEF0F4;border-radius:4px;overflow:hidden;width:100%}
.chk-prog span{display:block;height:100%;background:#2e7d32}
.chk-pill{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px}
.chk-pill.ok{background:#eaf6ec;color:#256b31}.chk-pill.flag{background:#fdecea;color:#b3261e}.chk-pill.none{background:#F3F4F6;color:#6B7385}

<body>

<div class="crop-wrap"><canvas id="cropC"></canvas></div><div class="crop-acts"><span class="note">The old picture moves to Images\DELETE.</span><button class="btn light" id="cropReset">Reset</button><button class="btn" id="cropSave">Save crop</button></div></div></div>
<script>
// Logo Library (LL vX.YZ). The page code is on GitHub; the data is not. It lives only in "Logo Library.xlsx" + the Images folder
// in Noelle's OneDrive (CLAUDE AI\CLAUDE\Logo Library), opened with the File System Access API (Edge/Chrome). Started from a copy of v13.
const VERSION = 'LL v1.45';
const XLSX_NAME = 'Logo Library.xlsx', IMG_DIR = 'Images', DELETE_DIR = 'DELETE', LS_DATA = 'logoLibrary_data_v1', LS_UI = 'logoLibrary_ui_v1';
const BY = 'Noelle';
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const coll = new Intl.Collator(undefined, {numeric:true, sensitivity:'base'});
const pad = n => String(n).padStart(2, '0');
const nowStamp = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const safeName = s => String(s || 'logo').replace(/[\\/:*?"<>|]/g, '-').trim();

// ---------------- Data ----------------
const SLOTS = [['spec', 'Spec Artwork', 'Spec'], ['logo', 'Logo (stitch)', 'Logo'], ['bar', 'Sew-Out (Barrett)', 'Sew-Out Barrett'], ['qd', 'Sew-Out (QD)', 'Sew-Out QD'], ['sew', 'Sew-Out (other)', 'Sew-Out']];
const SEWS = ['bar', 'qd', 'sew'];   // LL v1.10
const FILES = [['fEmb', 'EMB'], ['fDst', 'DST'], ['fPng', 'PNG'], ['fSpec', 'Spec']];
// Logos sheet: [header, field, kind]
const COLS = [['LL ID','id'],['EMB ID','emb'],['School / Account','school'],['Type','type'],['Ver','ver'],['Spec H','specH','num'],['Spec W','specW','num'],['DST H','dstH','num'],['DST W','dstW','num'],
  ['Size Check','sizeCheck','calc'],['Thread Colors (Madeira)','threads'],['# Stops','clrs','num'],['EMB','fEmb','check'],['DST','fDst','check'],['PNG','fPng','check'],['Spec','fSpec','check'],
  ['Approved (Box)','box','box'],['Box Drive','boxes','boxes'],['Status','status'],['To Do','todo','list'],['Flag','flag'],['Missing','missing','calc'],['Notes','notes','notes'],['Folder','folder'],
  ['Spec Artwork image','img_spec'],['Logo (stitch) image','img_logo'],['Sew-Out image','img_sew'],['Sew-Out Barrett image','img_bar'],['Sew-Out QD image','img_qd'],['Thread Status','tcStatus'],['Thread Changed','tcDate'],['Size OK','sizeOk','check'],['Files Folder','filesDir'],['Box Status','boxSt'],['Color Card','ccSt'],['Color Card Date','ccDate'],['Digitized By','digBy']];   // LL v1.41   // LL v1.40: Wilcom color card tracker   // LL v1.35: Box drive = Needs upload / Uploaded   // LL v1.33: Folder = main folder (spec sheet), Files Folder = version folder (DST / EMB / PNG / sew-outs)   // LL v1.31: size difference OK'd   // LL v1.27: thread color update tracker
const LABEL = {emb:'EMB ID', school:'School / Account', type:'Type', ver:'Ver', specH:'Spec H', specW:'Spec W', dstH:'DST H', dstW:'DST W', threads:'Thread Colors', clrs:'# Stops',
  fEmb:'EMB file', fDst:'DST file', fPng:'PNG file', fSpec:'Spec file', box:'Approved (Box)', tcStatus:'Thread Status', filesDir:'Files folder', boxSt:'Box drive', ccSt:'Color card', digBy:'Digitized by', sizeOk:'Size difference OK', status:'Status', flag:'Flag', notes:'Notes', folder:'Main folder (spec sheet)'};
const KNOWN_SHEETS = ['Logos', 'Schools', 'School Colors', 'Lists', 'Page Edits', 'Internal Notes', 'Box Drive', 'Setup Check', 'Products', 'Settings', 'Deleted Logos', 'Info'];
let DB = emptyDB();
function emptyDB(){ return {logos:[], lists:{status:[], todo:[], type:['Collegiate','Mainline'], flag:['REVIEW']}, listsNote:'', edits:[], notes:[], check:{}, products:[], mounts:[], deleted:[], schools:{}, other:[], savedAt:''}; }
const ARCH = 'Inactive / Archived', RETIRED = 'Retired';   // LL v1.04: archived and retired logos only show in their school (Accounts tab) or at the bottom of Mainline
const inactive = l => l.status === ARCH || l.status === RETIRED;
const activeLogos = () => DB.logos.filter(l => !inactive(l));
function ensureLists(db){ [ARCH, RETIRED].forEach(v => { if (!db.lists.status.includes(v)) db.lists.status.push(v); }); if (!db.lists.type.includes('NFL')) db.lists.type.push('NFL'); return db; }   // LL v1.18: NFL type
function blankLogo(){ return {id:'', emb:'', school:'', type:'', ver:'', specH:'', specW:'', dstH:'', dstW:'', threads:'', clrs:'', fEmb:false, fDst:false, fPng:false, fSpec:false, box:false, boxes:[], status:'', todo:[], flag:'', notes:'', folder:'', img:{spec:'', logo:'', sew:'', bar:'', qd:''}, tcStatus:'', tcDate:'', sizeOk:false, filesDir:'', boxSt:'', ccSt:'', ccDate:'', digBy:''}; }
const byId = id => DB.logos.find(l => l.id === id);
function sizeRaw(l){ const n = [l.specH, l.specW, l.dstH, l.dstW].map(v => parseFloat(v));
  if (String(l.specH).trim() === '' || String(l.dstH).trim() === '' || n.some(isNaN)) return '';
  return Math.max(Math.abs(n[0] - n[2]), Math.abs(n[1] - n[3])) > 0.05 ? 'CHECK' : 'OK'; }
function sizeCheck(l){ const r = sizeRaw(l); return r === 'CHECK' && l.sizeOk ? 'OK' : r; }   // LL v1.31: a CHECK she OK'd counts as OK
// LL v1.08: internal notes (newest first), like the portals. Logos use their LL ID; schools use S:<account>.
const NOTES_V13 = '2026-11-11T00:00:00';
const notesFor = id => (DB.notes || []).filter(n => n.id === id).reverse().sort((a, b) => b.ts.localeCompare(a.ts));
const notesText = id => notesFor(id).map(n => n.ts.slice(5, 7) + '/' + n.ts.slice(8, 10) + '/' + n.ts.slice(2, 4) + ': ' + n.text).join('\n');
function migrateNotes(db){   // the old single Notes box becomes the first note (from the v13 build on 11/11/26)
  db.notes = db.notes || [];
  db.logos.forEach(l => { if (l.notes && String(l.notes).trim()) db.notes.push({ts:NOTES_V13, id:l.id, text:String(l.notes).trim(), by:'from v13'}); l.notes = ''; });
  Object.keys(db.schools).forEach(k => { const x = db.schools[k]; if (x.notes && String(x.notes).trim()) db.notes.push({ts:NOTES_V13, id:'S:' + k, text:String(x.notes).trim(), by:BY}); x.notes = ''; });
  return db;
}
// LL v1.08: To Do = one dropdown (the step) + its own Check Thread Colors checkbox
const TC = 'Check Thread Colors';
// LL v1.12: Products (kit info: one row per SKU). id = LL ID ('' = no logo yet), dst = Insignia URL (the DST file name)
const PF = [['name', 'Display Name'], ['color', 'Product Color'], ['sku', 'SKU'], ['place', 'Insignia Placement'], ['dst', 'Insignia URL']];
const prods = () => DB.products || (DB.products = []);
const prodsOf = id => prods().map((p, i) => [p, i]).filter(([p]) => p.id === id);
const embOf = p => { const l = p.id && byId(p.id); return l ? l.emb : String(p.dst || '').replace(/\.dst$/i, ''); };
function sewStatus(l){ if (!l) return 'No logo yet'; if (isApproved(l)) return 'Approved'; if (inactive(l)) return l.status; return SEWS.some(k => l.img[k]) ? 'Sew-out on file' : 'Needs sew-out'; }
// LL v1.09: Box drive uploads, newest first: [{ver, date:'YYYY-MM-DD'}]
const bx = l => l.boxes || (l.boxes = []);
const isoDay = v => { v = String(v || '').trim(); let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(+m[1]) + '-' + pad(+m[2]); return v; };
const boxText = b => [b.ver ? 'Ver ' + b.ver : 'no version', b.date ? fmtDate(b.date) : 'no date'].join(' · ');
const sortBoxes = l => bx(l).sort((a, b) => String(b.date).localeCompare(String(a.date)));
const stepOf = l => l.todo.find(t => t !== TC) || '';
const isApproved = l => l.status === 'Approved';   // LL v1.15: approval = Status only; Approved (Box) = uploaded to the Box drive (separate check, 11/20)
const apPill = l => isApproved(l) ? '<span class="apill" title="Status Approved' + (l.box ? ' + uploaded to the Box drive' : '') + '">APPROVED</span>' : '';
function missing(l){ return !SEWS.some(k => l.img[k]) ? 'Sew-Out' : ''; }   // LL v1.21: EMB is optional (only ticked when there's a native EMB)
const needsSew = l => (!SEWS.some(k => l.img[k]) || l.todo.some(t => /(need|reorder).*sew/i.test(t))) && !inactive(l);   // LL v1.22: no sew-out picture, OR To Do says it needs a (new) sew-out
const fmtNum = v => { const n = parseFloat(v); return isNaN(n) ? '' : n.toFixed(2); };

// ---------------- Excel (SheetJS) ----------------
function cellOut(l, f, kind){
  if (kind === 'calc') return f === 'sizeCheck' ? sizeCheck(l) : missing(l);
  if (kind === 'check') return l[f] ? '✓' : '—';
  if (kind === 'box') return l[f] ? '✓' : '';
  if (kind === 'list') return (l[f] || []).join('; ');
  if (kind === 'notes') return notesText(l.id);
  if (kind === 'boxes') return bx(l).map(b => (b.ver || '-') + ' ' + (b.date ? fmtDate(b.date) : '')).join('; ');
  if (kind === 'num'){ const s = String(l[f] == null ? '' : l[f]).trim(); return s !== '' && isFinite(+s) ? +s : s; }
  if (f.startsWith('img_')) return l.img[f.slice(4)] || '';
  return l[f] == null ? '' : l[f];
}
function buildWorkbook(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([COLS.map(c => c[0])].concat(DB.logos.map(l => COLS.map(([, f, k]) => cellOut(l, f, k)))));
  ws['!cols'] = [10, 24, 22, 11, 5, 7, 7, 7, 7, 9, 40, 6, 5, 5, 5, 5, 9, 22, 16, 40, 8, 14, 40, 40, 28, 28, 28, 28, 28, 18, 12, 8, 70, 14, 18, 12, 18].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, 'Logos');
  DB.other.forEach(s => { const o = XLSX.utils.aoa_to_sheet(s.rows); if (s.cols) o['!cols'] = s.cols; XLSX.utils.book_append_sheet(wb, o, s.name); });
  // LL v1.06: school info + colors (current set and past sets, newest first)
  const sch = Object.keys(DB.schools).sort(coll.compare);
  const ss = XLSX.utils.aoa_to_sheet([['Account', 'Full name', 'EMB code', 'Notes', 'Logo image']].concat(sch.map(k => { const x = DB.schools[k]; return [k, x.name, x.code, notesText('S:' + k), x.logo || '']; })));
  ss['!cols'] = [22, 34, 12, 60, 34].map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ss, 'Schools');
  const cr = [];
  sch.forEach(k => { const x = DB.schools[k]; x.colors.forEach(c => cr.push([k, 'Current', '', c.name, c.pms, c.mad]));
    x.past.forEach(pz => pz.colors.forEach(c => cr.push([k, 'Past', pz.until, c.name, c.pms, c.mad]))); });
  const cs = XLSX.utils.aoa_to_sheet([['Account', 'Set', 'Used until', 'Color', 'PMS', 'Madeira']].concat(cr));
  cs['!cols'] = [22, 9, 12, 20, 14, 12].map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, cs, 'School Colors');
  const L = DB.lists, n = Math.max(L.status.length, L.todo.length, L.type.length, L.flag.length);
  const lr = [['STATUS', 'TO DO', 'TYPE', 'FLAG', '', DB.listsNote || 'Edit these lists - the Logo Library page reads its dropdowns and To Do checkboxes from here.']];
  for (let i = 0; i < n; i++) lr.push([L.status[i] || '', L.todo[i] || '', L.type[i] || '', L.flag[i] || '']);
  const ls = XLSX.utils.aoa_to_sheet(lr); ls['!cols'] = [20, 22, 12, 10, 4, 60].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, ls, 'Lists');
  const es = XLSX.utils.aoa_to_sheet([['Date','Time','LL ID','EMB ID','What changed','From','To','By']].concat(DB.edits.slice().sort((a, b) => b.ts.localeCompare(a.ts)).map(e => [e.ts.slice(0, 10), e.ts.slice(11), e.id, e.emb, e.what, e.from, e.to, e.by])));
  es['!cols'] = [12, 10, 10, 24, 30, 30, 30, 14].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, es, 'Page Edits');
  const nm = id => id.startsWith('S:') ? id.slice(2) : ((byId(id) || {}).emb || '');
  const ns = XLSX.utils.aoa_to_sheet([['Date','Time','LL ID / School','EMB ID / School','Note','By']].concat((DB.notes || []).slice().sort((a, b) => b.ts.localeCompare(a.ts)).map(n => [n.ts.slice(0, 10), n.ts.slice(11), n.id, nm(n.id), n.text, n.by])));
  ns['!cols'] = [12, 10, 14, 24, 80, 12].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, ns, 'Internal Notes');
  const bxr = []; DB.logos.forEach(l => bx(l).forEach(b => bxr.push([l.id, l.emb, b.ver, b.date])));
  const bs = XLSX.utils.aoa_to_sheet([['LL ID', 'EMB ID', 'Version', 'Date added']].concat(bxr)); bs['!cols'] = [10, 24, 9, 12].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, bs, 'Box Drive');
  const ck = DB.check || {}, cr2 = Object.keys(ck).map(id => [id, (byId(id) || {}).emb || '', ck[id].res === 'ok' ? 'Verified' : 'Flagged', ck[id].note || '', ck[id].ts || '']);
  const cs2 = XLSX.utils.aoa_to_sheet([['LL ID', 'EMB ID', 'Result', 'Note for Claude', 'Checked at']].concat(cr2)); cs2['!cols'] = [10, 24, 10, 70, 20].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, cs2, 'Setup Check');   // LL v1.11 (temporary)
  const ps = XLSX.utils.aoa_to_sheet([['LL ID', 'EMB ID'].concat(PF.map(f => f[1]), 'Kit Notes', 'Archived')].concat(prods().map(p => [p.id, p.id ? embOf(p) : ''].concat(PF.map(([k]) => p[k] || ''), p.note || '', p.arch ? '✓' : ''))));
  ps['!cols'] = [10, 24, 70, 26, 38, 18, 28, 40, 9].map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ps, 'Products');

  if (th){ const k = th.dataset.sort, s = state.sort[state.tab]; state.sort[state.tab] = s && s.k === k ? {k, d:-s.d} : {k, d:1}; saveUi(); render(); return; }
  const sh = e.target.closest('.sec-head[data-sec]');
  if (sh){ const k = sh.dataset.sec, open = sh.querySelector('.chev').innerHTML.charCodeAt(0) === 9660; state.secOpen[k] = !open; saveUi(); render(); return; }
  const acr = e.target.closest('tr.acct-row');
  if (acr){ state.acct = acr.dataset.acct; state.open = ''; saveUi(); render(); window.scrollTo(0, 0); return; }
  const ar = e.target.closest('tr.aud-row');
  if (ar && ar.dataset.id.startsWith('S:')){ state.acct = ar.dataset.id.slice(2); state.open = ''; saveUi(); render(); window.scrollTo(0, 0); return; }
  if (ar){ const l = byId(ar.dataset.id); if (l) openLogo(l); else toast('That logo isn&rsquo;t in the library anymore.'); return; }
  const pr = e.target.closest('tr.prow');
  if (pr && !e.target.closest('input')){ const l = pr.dataset.pid && byId(pr.dataset.pid); if (l) openLogo(l); return; }
  const pop = e.target.closest('[data-pop]');
  if (pop){ const l = byId(pop.dataset.id); if (l) openPop(l, pop.dataset.pop); return; }
  if (e.target.closest('.card-cell')) return;
  const row = e.target.closest('tr.row');
  if (row){ state.open = state.open === row.dataset.id ? '' : row.dataset.id; render(); }
});
page.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ckonly){ state.ckOnly = t.value; saveUi(); render(); return; }   // LL v1.45
  if (t.dataset.filter){ fOf(t.dataset.ftab || 'all')[t.dataset.filter] = t.value; saveUi(); render(); return; }
  if (t.dataset.audit){ state.audit[t.dataset.audit] = t.value; saveUi(); render(); return; }
  if (t.dataset.pfilter){ (state.pf = state.pf || {})[t.dataset.pfilter] = t.value; saveUi(); render(); return; }
  if (t.dataset.pf){ const p = prods()[+t.dataset.pi], k = t.dataset.pf, v = t.value.trim(); if (!p || (p[k] || '') === v) return;
    const was = p[k] || ''; p[k] = v; const pl = byId(p.id); if (pl) logEdit(pl, {name:'Product name', color:'Product color', sku:'SKU', place:'Placement', dst:'Insignia URL'}[k], (p.sku && k !== 'sku' ? p.sku + ': ' : '') + was, v); touch(); if (pl) refreshRow(pl); return; }
  if (t.dataset.plink){ const p = prods()[+t.dataset.plink], v = t.value.trim().toLowerCase(), l = DB.logos.find(x => x.emb.toLowerCase() === v); if (!p || !v) return;
    if (!l){ toast('No logo with EMB ID &ldquo;' + esc(t.value) + '&rdquo;.'); return; }
    p.id = l.id; logEdit(l, 'Linked product', p.dst || '', p.sku || p.name); touch(); render(); toast('Linked ' + esc(p.sku || p.name) + ' to ' + esc(l.emb) + '.'); return; }
  if (t.dataset.sf || t.dataset.sc){   // school page: save without redrawing (so the next click still lands)
    const k = t.dataset.acct, x = schoolSave(k, schoolGet(k)), v = t.value.trim(), LBL = {name:'Full name', code:'Abbreviation / EMB code', notes:'Notes', pms:'PMS', mad:'Madeira'};
    if (t.dataset.sf){ if (x[t.dataset.sf] === v) return; schoolLog(k, 'School ' + LBL[t.dataset.sf], x[t.dataset.sf], v); x[t.dataset.sf] = v; }
    else { const c = x.colors[+t.dataset.i]; if (!c || c[t.dataset.sc] === v) return; schoolLog(k, 'Color ' + (+t.dataset.i + 1) + ' ' + (LBL[t.dataset.sc] || 'name'), c[t.dataset.sc], v); c[t.dataset.sc] = v; }
    touch(); const hl = document.getElementById('shl'); if (hl) hl.innerHTML = schoolHist(k); return;
  }
  const l = t.dataset.id ? byId(t.dataset.id) : null; if (!l) return;
  if (t.dataset.todo){ setTodo(l, t.dataset.todo, t.checked); refreshRow(l); return; }
  if (t.dataset.step){ setStep(l, t.value); refreshRow(l); return; }
  if (t.dataset.ccst){ const v = t.value; if ((l.ccSt || '') === v) return; logEdit(l, 'Color card', l.ccSt || '', v || '(none)'); l.ccSt = v; l.ccDate = v ? nowStamp().slice(0, 10) : ''; touch(); refreshRow(l); const c = document.getElementById('cc-' + l.id); if (c) c.innerHTML = ccCell(l); return; }   // LL v1.40
  if (t.dataset.tstat){ const v = t.value; if ((l.tcStatus || '') === v) return; logEdit(l, 'Thread Status', l.tcStatus || '', v || '(none)'); l.tcStatus = v; l.tcDate = v ? nowStamp().slice(0, 10) : ''; touch(); refreshRow(l); return; }
  if (t.dataset.flagcb){ setField(l, 'flag', t.checked ? (DB.lists.flag[0] || 'REVIEW') : ''); refreshRow(l); return; }
  if (t.dataset.bx){ const b = bx(l)[+t.dataset.i], k = t.dataset.bx, v = k === 'date' ? t.value : t.value.trim(); if (!b || b[k] === v) return;
    const was = boxText(b); b[k] = v; logEdit(l, 'Box ' + (k === 'ver' ? 'version' : 'date'), was, boxText(b)); touch();
    if (k === 'date'){ sortBoxes(l); render(); } else refreshRow(l); return; }
  const f = t.dataset.f; if (!f) return;
  if (t.type === 'checkbox') setField(l, f, t.checked); else setField(l, f, t.value.trim());
  refreshRow(l);
});
// After an edit in the open card, update just that logo's row + the card's live notes (a full redraw would eat the click into the next field).
function refreshRow(l){
  const tr = document.querySelector('tr.row[data-id="' + l.id + '"]');
  if (tr){ const d = tr.querySelector('[data-todo]'), sec = d ? d.dataset.todo : ''; tr.innerHTML = TAB_COLS[state.tab].map(k => '<td>' + C[k].v(l, sec) + '</td>').join(''); }
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('cl-' + l.id, checklist(l)); set('ck-' + l.id, chkCell(l)); set('ts-' + l.id, tsCell(l)); set('sc-' + l.id, scText(l)); set('ms-' + l.id, msText(l)); set('tc-' + l.id, tcText(l)); set('hs-' + l.id, histSum(l)); set('hl-' + l.id, histRows(l));

  renderTabs(); hookImgs();
}
page.addEventListener('input', e => { if (e.target.id !== 'aSearch') return; state.audit.q = e.target.value; saveUi(); const pos = e.target.selectionStart; render(); const n = document.getElementById('aSearch'); n.focus(); n.setSelectionRange(pos, pos); });
page.addEventListener('keydown', e => { const t = e.target; if (!(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && t.classList && t.classList.contains('note-in'))) return;   // LL v1.08: Ctrl+Enter saves the note
  e.preventDefault(); if (addNote(t.dataset.nid, t.value)){ render(); toast('Note added.'); } });
page.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.hist) histOpen[d.dataset.hist] = d.open; if (d.dataset && d.dataset.fold) foldOpen[d.dataset.fold] = d.open; }, true);
document.getElementById('picFile').onchange = e => { const f = e.target.files[0], l = pickFor && byId(pickFor[0]); if (f && l) putPicture(l, pickFor[1], f); };
page.addEventListener('dragover', e => { const d = e.target.closest('[data-drop],[data-ccdrop]'); if (d){ e.preventDefault(); d.classList.add('over'); } });
page.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop],[data-ccdrop]'); if (d) d.classList.remove('over'); });
page.addEventListener('drop', e => { const d = e.target.closest('[data-ccdrop]'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0], l = byId(d.dataset.id); if (f && l) applyCardFile(l, f); });   // LL v1.43
page.addEventListener('drop', e => { const d = e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer.files[0], l = byId(d.dataset.id), k = d.dataset.drop; if (!f || !l) return;
  if (d.classList.contains('th') && l.img[k] && !confirm('Replace the ' + SLOTS.find(x => x[0] === k)[1] + ' picture for ' + (l.emb || l.id) + '?\n(The old one moves to Images\\DELETE.)')) return;   // LL v1.39: table drops ask first
  putPicture(l, k, f); });
window.addEventListener('dragover', e => { if (!e.target.closest || !e.target.closest('[data-drop],[data-ccdrop]')) e.preventDefault(); });   // a picture dropped outside a box does nothing (instead of opening the file)
window.addEventListener('drop', e => { if (!e.target.closest || !e.target.closest('[data-drop],[data-ccdrop]')) e.preventDefault(); });

boot();
</script>
