.header{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}

.ridge{display:flex;height:26px}.ridge span{width:4px}.ridge .r{background:var(--red)}.ridge .n{background:var(--navy)}

.tab{padding:14px 18px;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.page{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
h1{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
.h2{font-size:18px;font-weight:700;color:var(--navy);margin:26px 0 4px}
.sub{color:var(--grey);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

.bar input{flex:1;min-width:220px}

.srt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px;color:var(--navy)}.srt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bar .srt-row select{padding:7px 8px;min-width:0;font-size:13px}.srt-row select:first-of-type{flex:1}.srt-grip{cursor:grab;color:var(--lgrey);letter-spacing:-3px;padding-right:2px}
.srt-rm{border:none;background:none;font-size:18px;color:var(--grey);cursor:pointer;padding:0 4px}.srt-link{border:none;background:none;color:var(--navy);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 0}
.srt-add{margin-top:4px}.srt-none{font-size:12px;color:var(--grey);margin:2px 0 8px}
.sec{margin-bottom:14px}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;user-select:none}
.sec-head .chev{width:14px;color:var(--grey);font-size:11px}
.sec-head .name{font-size:18px;font-weight:700;color:var(--navy)}
.sec-head .cnt{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--grey)}
.tblwrap{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin:4px 0 6px}
.tbl{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
.tbl td.wrap{white-space:normal;overflow-wrap:anywhere}
.tbl th{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);text-align:left;padding:14px 12px;border-bottom:2px solid var(--navy);background:#fff;cursor:pointer;white-space:nowrap}
.tbl th .arr{color:var(--lgrey);font-size:10px;margin-left:3px}
.tbl th.sorted{color:var(--navy)}.tbl th.sorted .arr{color:var(--navy)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:12px;padding:4px 10px}
.dtp{display:inline-block;font-size:13px;font-weight:600;border-radius:5px;padding:3px 8px}
.dtp.plain{font-weight:400;color:var(--grey);padding-left:0}
.dtp.red{background:#f8d7d7;color:#a61b1b}.dtp.yellow{background:#fdf0c4;color:#7a5800}
.img-pend{color:#e0702a;font-size:15px}.img-ok{color:#2E7D32;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:8px 0 4px}
@media(max-width:900px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pipe .box{margin:0;text-align:center;padding:14px 8px;border-top-width:4px}
.pipe .num{font-size:24px;font-weight:700;color:var(--navy)}
.pipe .lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey);margin-top:4px}
.back{background:none;border:none;color:var(--navy);font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;padding:0}
.demo{font-size:12px;background:#fff4d6;border:1px solid #f0d58a;color:#7a5800;border-radius:6px;padding:8px 12px;margin-bottom:14px}
.fsec{display:inline-block;font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic",sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:#F0F1F3;border-left:5px solid var(--navy);border-radius:3px;padding:8px 14px;margin:20px 0 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.fcard{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.fcard b{display:block;margin-bottom:4px}
.fcard span{font-size:12px;color:var(--grey)}
.usewhen{background:#eaf4f8;border:1px solid #b8dae4;color:#1c5a6a;font-weight:700;font-size:12px;border-radius:6px;padding:8px 10px}
.rednote{background:#fdecec;border:1px solid #f3c4c4;color:#8a1c1c;font-weight:600;font-size:13px;border-radius:6px;padding:9px 12px}
.bluenote{background:#eaf4f8;border:1px solid #b8dae4;color:#1c3a48;font-size:12px;border-radius:6px;padding:9px 12px}
.greennote{background:#eaf6ec;border:1px solid #c5e5cb;color:#256b31;font-weight:700;font-size:12px;border-radius:6px;padding:9px 12px}
.yellownote{background:#fdf6e3;border:1px solid #f0dfaa;color:#7a5a12;font-weight:700;font-size:12px;border-radius:6px;padding:9px 12px}
.fin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
.flbl{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.row{cursor:pointer}.row:hover td{background:#fafbfd}
.row.open td{background:#f3f5fa}
.row .chev{color:var(--grey);font-size:11px;width:12px;display:inline-block}
.logo{font-weight:600;color:var(--navy-d)}
.sdot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;margin-right:7px;vertical-align:1px;flex:none}
.logo-cell{display:flex;align-items:center}
.rush-r{flex:none;display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;background:#f8d7d7;color:#a61b1b;font-size:11px;font-weight:800;margin-right:6px}.rush-r.imp{background:#fff3c4;color:#7a5b00}
.stepper{display:flex;align-items:center;gap:8px}
.sbtn{font:inherit;font-size:14px;min-width:38px;height:34px;padding:0 12px;border:1px solid #e3e6ee;border-radius:7px;background:#fff;color:var(--navy-d);cursor:pointer}
.sbtn.txt{font-size:13px;font-weight:700}
.sbtn:hover{border-color:#c4cbe0}

.rev-num{font-size:20px;font-weight:700;color:var(--red);min-width:22px}.ver{font-size:11px;color:var(--lgrey);margin-left:5px}
.acct{color:#4b5563}

.dt.red{background:#f8d7d7;color:#a61b1b}.dt.yellow{background:#fdf0c4;color:#7a5800}

.card-cell{padding:0!important;background:#f3f5fa}
.card{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:16px 18px 18px 34px;white-space:normal}

.box{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:12px}

.box h3 .num{font-family:'Aptos','Segoe UI',sans-serif;background:var(--navy);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.f label{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:#fff}
.f textarea{min-height:44px;resize:vertical}
.f.full{grid-column:1/-1}
.file{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.file:last-of-type{border-bottom:none}
.ftype{font-size:10px;font-weight:700;background:var(--navy);color:#fff;border-radius:4px;padding:2px 6px;min-width:34px;text-align:center}
.fname{flex:1;overflow:hidden;text-overflow:ellipsis}
.btn{font:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;padding:8px 14px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--navy-h);border-color:var(--navy-h)}
.btn.light{background:#fff;color:var(--navy);border-color:var(--line)}

.btn.danger{background:#fff;color:var(--red);border-color:#e8c2c7}

.hist{font-size:12px}

.foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.empty{background:#fff;border:1px dashed #d6dbe4;border-radius:8px;padding:18px;text-align:center;color:var(--grey);font-size:13px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}.toast.on.act{pointer-events:auto}.toast .btn{margin-left:14px;vertical-align:middle}
.mailhead{font-size:12px;line-height:1.7;background:#f6f7fa;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0}

A", "UTSA"], ["UVA", "UVA"], ["VANDERBILT", "VAN"], ["VILLANOVA", "VIL"], ["VIRGINIA TECH", "VT"], ["WAKE FOREST", "WF"], ["WASHINGTON", "WASH"], ["WASHINGTON STATE", "WSHST"], ["WEST VIRGINIA", "WVU"], ["WESTERN KENTUCKY", "WKU"], ["WESTERN MICHIGAN", "WMU"], ["WISCONSIN", "WISC"], ["XAVIER", "XAV"]];
const schoolLabel = (n, a) => n + ' (' + a + ')';

  const t = String(v || '').trim(); if (!t) return ''; const u = t.toUpperCase();

// ---------------- Dates ----------------
let today;
function refreshToday(){ today = new Date(); today.setHours(0,0,0,0); }
refreshToday();
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayIso = () => isoOf(new Date());
const nowStamp = () => { const d = new Date(); return isoOf(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const parseIso = s => { const m = String(s || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
function normDate(v){ const t = String(v || '').trim(); if (!t) return ''; if (/^\d{4}-\d{1,2}-\d{1,2}/.test(t)){ const d = parseIso(t); return isoOf(d); }
  const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/); if (m){ const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; return isoOf(new Date(y, m[1]-1, +m[2])); } return t; }
const off = s => { const d = parseIso(s); return d ? Math.round((d - today) / 86400000) : null; };   // days from today (negative = past)
const fmt = s => { const d = parseIso(s); return d ? pad(d.getMonth()+1) + '/' + pad(d.getDate()) + '/' + String(d.getFullYear()).slice(2) : ''; };   // 10/20/26
const time12 = ts => { const m = String(ts || '').match(/T(\d{2}):(\d{2})/); if (!m) return ''; const h = +m[1]; return ((h % 12) || 12) + ':' + m[2] + (h < 12 ? ' AM' : ' PM'); };
function bizDays(n){ if (n < 0) return -1; let c = 0; const d = new Date(today); for (let i = 0; i < n; i++){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w && w !== 6) c++; } return c; }

async function saveFiles(l, files){
  if (!dirHandle){ toast('Connect Excel first (top right) so files can be saved in your OneDrive folder.'); return []; }
  if (!(await permOk(dirHandle, true))){ setSave('reconnect'); return []; }
  const d = await logoDir(l), names = [];
  for (const f of files){
    let name = safeName(f.name) || 'file', n = 2; const dot = name.lastIndexOf('.'), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
    while (await exists(d, name)) name = base + ' (' + (n++) + ')' + ext;
    const w = await (await d.getFileHandle(name, {create:true})).createWritable(); await w.write(f); await w.close();
    l.files.push({name, added:todayIso()}); names.push(name);
  }
  if (names.length) log(l, 'File', 'Added ' + names.join(', '));
  return names;
}
async function getFile(l, name){ const d = await logoDir(l); return (await d.getFileHandle(name)).getFile(); }
async function openFile(l, name){
  if (!dirHandle || !(await permOk(dirHandle, true))){ toast('Reconnect Excel first (top right).'); return; }
  try { const f = await getFile(l, name), url = URL.createObjectURL(f);
    if (/\.(pdf|png|jpe?g|gif|webp|svg|txt)$/i.test(name)) window.open(url, '_blank'); else { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(e){ toast('Couldn&rsquo;t find ' + esc(name) + ' in the Files folder.'); }
}
async function removeFile(l, name){
  if (!confirm('Remove "' + name + '" from this logo?\n\nIt moves to the Files\\DELETE folder, so you can delete it yourself later.')) return;
  try {
    const d = await logoDir(l), f = await getFile(l, name);
    const del = await (await (await dirHandle.getDirectoryHandle(FILES_DIR, {create:true})).getDirectoryHandle(DELETE_DIR, {create:true})).getDirectoryHandle(l.dir, {create:true});
    const w = await (await del.getFileHandle(name, {create:true})).createWritable(); await w.write(f); await w.close();
    await d.removeEntry(name);
  } catch(e){}
  l.files = l.files.filter(x => x.name !== name); if (l.sheetFile === name) l.sheetFile = '';
  log(l, 'File', 'Removed ' + name + ' (moved to Files\\DELETE)'); touch(); render();
}
async function downloadAll(l){
  if (!l.files.length){ toast('No files on this logo yet.'); return; }
  if (!dirHandle || !(await permOk(dirHandle, true))){ toast('Reconnect Excel first (top right).'); return; }
  const zip = new JSZip();
  for (const x of l.files){ try { zip.file(x.name, await getFile(l, x.name)); } catch(e){} }
  const url = URL.createObjectURL(await zip.generateAsync({type:'blob'})), a = document.createElement('a');
  a.href = url; a.download = safeName(l.logo || l.id) + '.zip'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}

      '<input id="plQ" placeholder="Search tasks&hellip;" value="' + esc(plV.q) + '" style="flex:1">' +
      '<select id="plPri"><option value="">All priorities</option>' + PL_PRI.map(p => '<option' + (plV.pri === p ? ' selected' : '') + '>' + p + '</option>').join('') + '<option value="none"' + (plV.pri === 'none' ? ' selected' : '') + '>No priority</option></select>' +
      '<select id="plSort">' + PL_SORT.map(([v, l]) => '<option value="' + v + '"' + (plV.sort === v ? ' selected' : '') + '>Sort: ' + l + '</option>').join('') + '</select>' +
      '<button class="btn light" id="plReset">Reset filters</button></div>' +
    '<div class="lcard">' + body + '</div>';
  plKeys();
  const ni = document.getElementById('plNew'); if (ni) ni.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); document.querySelector('[data-pl="add"]').click(); } };
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onchange = () => { f(el.value); render(); }; };
  on('plShow', v => { plV.show = v; if (v === 'day' && !plV.day) plV.day = today; }); on('plPri', v => { plV.pri = v; }); on('plSort', v => { plV.sort = v; }); on('plDay', v => { plV.day = v || today; });
  const qi = document.getElementById('plQ'); if (qi) qi.oninput = () => { plV.q = qi.value; const pos = qi.selectionStart; render(); const n = document.getElementById('plQ'); n.focus(); n.setSelectionRange(pos, pos); };
  const rs = document.getElementById('plReset'); if (rs) rs.onclick = () => { plV = {show:'upcoming', day:'', q:'', pri:'', sort:'pri'}; render(); };
}

function render(){ renderMain(); bulkBar(); }   // EP v2.24
function renderMain(){
  refreshToday(); { const n1 = barAutoFollow(), n2 = apprAutoRemind(); if (n1 || n2) touch(); } if (tdReady() && (plMigrate() | plRollover())) touch(); renderNotifs();   // EP v2.36: planner   // EP v2.14 / v2.15
  if (!TODO_OFF && tdApprovalCheck()) touch();
  document.getElementById('tabs').innerHTML = TABS.map(t => '<button class="tab' + (t.key === state.tab && !msearch.trim() ? ' on' : '') + (t.right ? ' tab-right' : '') + '" data-tab="' + t.key + '">' + (t.label || t.title) + '</button>').join('');
  let dl = document.getElementById('acctList'); if (!dl){ dl = document.createElement('datalist'); dl.id = 'acctList'; document.body.appendChild(dl); }
  const acctNames = [...new Set(DB.logos.concat(DB.hidden || []).map(l => l.account).concat((LIVE_ACCTS.accounts || []).map(a => a.name)).filter(Boolean))].sort((a, b) => a.localeCompare(b));   // EP v2.18: + live-portal accounts
  if (dl.dataset.n !== String(acctNames.length)){ dl.innerHTML = acctNames.map(a => '<option value="' + esc(a) + '">').join(''); dl.dataset.n = acctNames.length; }
  if (!document.getElementById('schoolList')){ const sl = document.createElement('datalist'); sl.id = 'schoolList'; sl.innerHTML = SCHOOLS.map(([n, a]) => '<option value="' + esc(schoolLabel(n, a)) + '">').join(''); document.body.appendChild(sl); }   // EP v2.06
  let pl = document.getElementById('peopleList'); if (!pl){ pl = document.createElement('datalist'); pl.id = 'peopleList'; document.body.appendChild(pl); }   // EP v2.22
  pl.innerHTML = [...new Set(MAIL_PEOPLE.concat(REPS, DB.logos.map(l => l.rep).filter(Boolean)))].map(a => '<option value="' + esc(a) + '">').join('');
  let rl = document.getElementById('repAll'); if (!rl){ rl = document.createElement('datalist'); rl.id = 'repAll'; document.body.appendChild(rl); }   // EP v2.05
  rl.innerHTML = [...new Set(REPS.concat(DB.logos.concat(DB.hidden || []).map(l => l.rep).filter(Boolean)))].sort().map(a => '<option value="' + esc(a) + '">').join('');
  showBanner();
  if (msearch.trim()){ renderMasterSearch(); return; }
  const tab = TABS.find(t => t.key === state.tab);
  if (tab.audit){ renderAudit(tab); return; }
  if (tab.todo){ renderTodo(tab); return; }
  if (tab.submit){ renderSubmit(tab); return; }
  if (tab.accounts){ renderAccounts(tab); return; }
  if (tab.reports){ if (rpView === 'audit') renderAudit(AUDIT_TAB); else renderReports(tab); return; }   // EP v2.17; v2.38 Audit sub-tab
  if (tab.today){ if (td2View === 'planner') renderPlanner(tab); else renderToday2(tab); return; }   // EP v2.37: Planner is a sub-tab of To Do   // EP v2.23
  const group = state.group[tab.key] || 'status';
  let html = (tab.focus ? pipelineHtml() + '<div class="lcard">' + cardHead('Today&rsquo;s Focus') + '<div class="sub" style="margin:-8px 0 16px">' + tab.sub + ' Click a row to open it.</div><div class="bar" style="margin:-6px 0 12px">' + '<select id="deptF"><option value="">All departments</option>' + DEPTS.map(x => '<option' + (state.dept[tab.key] === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' + sortsCtl(tab.key) + '</div>'
                        : '<h1>' + tab.title + '</h1><div class="sub">' + tab.sub + ' Click a row to open it. Red In Hand Dates show first, then the oldest. Change it with Sorts, or click a column name.</div>') +
    (tab.focus ? '' : '<div class="bar"><input id="search" placeholder="Search account, logo, sales rep or #&hellip;" value="' + esc(state.search[tab.key] || '') + '">' +
    (tab.sections ? '<select id="statF"><option value="">All statuses</option>' + tab.sections.map(x => '<option' + (state.stat[tab.key] === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' : '') +
    '<select id="group"><option value="status"' + (group === 'status' ? ' selected' : '') + '>Group: Status</option><option value="account"' + (group === 'account' ? ' selected' : '') + '>Group: Account</option><option value="rep"' + (group === 'rep' ? ' selected' : '') + '>Group: Sales Rep</option><option value="project"' + (group === 'project' ? ' selected' : '') + '>Group: Project</option><option value="none"' + (group === 'none' ? ' selected' : '') + '>Group: No grouping</option></select>' +
    '<select id="deptF"><option value="">All departments</option>' + DEPTS.map(x => '<option' + (state.dept[tab.key] === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '<option value="none"' + (state.dept[tab.key] === 'none' ? ' selected' : '') + '>No department</option></select>' +
    sortsCtl(tab.key) + '<button class="btn light" id="reset">Reset filters</button><button class="btn light" data-collapse="all">Collapse all</button></div>');
  let list = tab.sections ? DB.logos.filter(l => tab.sections.includes(l.status)) : DB.logos.filter(l => !DONE.includes(l.status) && (subUrg(l) || urg(off(l.inHand)) === 'red'));   // EP v1.30: In Hand 30 days or less (or past), or past its due time
  if (tab.focus && state.dept[tab.key]) list = list.filter(l => l.dept === state.dept[tab.key]);   // EP v2.14: Department filter on the Dashboard too
  if (!tab.focus){ const q = (state.search[tab.key] || '').toLowerCase(), dp = state.dept[tab.key], st = state.stat[tab.key]; list = list.filter(l => matchQ(l, q) && (!dp || (dp === 'none' ? !l.dept : l.dept === dp)) && (!st || l.status === st)); }
  let groups;
  if (!tab.sections || group === 'none') groups = [[tab.sections ? 'All' : null, list]];
  else if (group === 'status'){ groups = tab.sections.map(s => [s, list.filter(l => l.status === s && !(tab.key === 'barrett' && (barNew(l) || (l.waitThreads && l.status === 'Pending Sew Out'))))]);
    if (tab.key === 'barrett'){ groups.unshift([BAR_REVIEW, list.filter(barNew)]); groups.push([BAR_WAIT, list.filter(l => !barNew(l) && l.waitThreads && l.status === 'Pending Sew Out')]); } }   // EP v2.14 (Parts 8-9)
  else { const keyOf = l => (group === 'account' ? l.account : group === 'project' ? l.project : l.rep) || (group === 'project' ? '(no project)' : '(blank)');   /* EP v2.22: Group: Project */ const keys = [...new Set(list.map(keyOf))].sort(); groups = keys.map(k => [k, list.filter(l => keyOf(l) === k)]); }
  const joined = groups.length && groups[0][0] !== null;   // EP v2.07: each section is its own box, with its heading above it
  if (joined){
    html += groups.map(([name, items]) => {
      const ck = tab.key + '|' + group + '|' + name, closed = !!state.collapsed[ck];
      const color = (name === FOLLOW_UP || name === BAR_REVIEW) && group === 'status' ? '#a61b1b' : name === BAR_WAIT && group === 'status' ? '#a88600' : (group === 'status' && STATUS_COLORS[name]) ? STATUS_COLORS[name].title : 'var(--navy)';
      return '<div class="sec"><div class="sec-head" data-sec="' + esc(ck) + '"><span class="chev">' + (closed ? '&#9656;' : '&#9662;') + '</span><span class="name" style="color:' + color + '">' + esc(name) + '</span><span class="cnt">' + items.length + '</span>' +
        (name === BAR_REVIEW && group === 'status' ? '<span class="note">Barrett replied. Resolve the message to clear it.</span>' : name === BAR_WAIT && group === 'status' ? '<span class="note">Barrett is waiting on thread colors. Follow-ups go once a week.</span>' : '') + '</div>' +
        (closed ? '' : items.length ? rowsHtml(items, tab, columns(tab, name)) : '<div class="tblwrap"><div class="empty">No logos here.</div></div>') + '</div>';
    }).join('');
  } else html += groups.map(([name, items]) => {
    if (name === null && tab.focus && items.length > FOCUS_LIMIT) return rowsHtml(items, tab, columns(tab, null), state.focusAll ? 0 : FOCUS_LIMIT) +
      '<div class="focus-more"><button class="btn light small" id="focusMore">' + (state.focusAll ? 'Show less' : 'Show all ' + items.length) + '</button></div>';
    return items.length ? rowsHtml(items, tab, columns(tab, null)) : '<div class="empty">' + (DB.logos.length ? 'Nothing needs attention right now.' : 'No logos yet. Add one in the Submit Request tab.') + '</div>';
  }).join('');
  if (tab.focus) html += '</div>';
  document.getElementById('page').innerHTML = html; syncCollapse();
  const s = document.getElementById('search'); if (s) s.oninput = () => { state.search[tab.key] = s.value; save(); const pos = s.selectionStart; render(); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(pos, pos); };
  const fm = document.getElementById('focusMore'); if (fm) fm.onclick = () => { state.focusAll = !state.focusAll; save(); render(); };
  const g = document.getElementById('group'); if (g) g.onchange = () => { state.group[tab.key] = g.value; save(); render(); };
  const sfl = document.getElementById('statF'); if (sfl) sfl.onchange = () => { if (sfl.value) state.stat[tab.key] = sfl.value; else delete state.stat[tab.key]; save(); render(); };   // EP v2.04
  const df = document.getElementById('deptF'); if (df) df.onchange = () => { if (df.value) state.dept[tab.key] = df.value; else delete state.dept[tab.key]; save(); render(); };
  const rs = document.getElementById('reset'); if (rs) rs.onclick = () => { delete state.sort[tab.key]; delete state.sorts[tab.key]; delete state.group[tab.key]; delete state.search[tab.key]; delete state.dept[tab.key]; delete state.stat[tab.key]; save(); render(); };
}
document.addEventListener('click', e => {
  const so = e.target.closest('[data-srt]'); if (so){ const key = sortKeyNow(), a = so.dataset.srt, act = activeSorts(key).map(x => ({k:x.k, dir:x.dir}));   // EP v1.46
    if (a === 'toggle'){ sortsOpen = sortsOpen === key ? false : key; render(); return; }
    if (a === 'clear'){ setSorts(key, []); return; }
    if (a === 'rm'){ act.splice(+so.dataset.i, 1); setSorts(key, act); return; }
    if (a === 'add'){ const used = new Set(act.map(x => x.k)), f = sortFields(key).find(x => !used.has(x.k)); if (f){ act.push({k:f.k, dir:1}); setSorts(key, act); } return; }
    return; }
  if (sortsOpen && !e.target.closest('.srt-w')){ sortsOpen = false; render(); }
  const ht = e.target.closest('.hist-toggle');
  if (ht){ const body = ht.nextElementSibling, open = body.style.display !== 'none'; body.style.display = open ? 'none' : ''; ht.querySelector('.hchev').innerHTML = open ? '&#9656;' : '&#9662;'; return; }   // History starts closed every time a logo opens
  const sb = e.target.closest('.sbtn');
  if (sb){ const l = byId(sb.dataset.id), a = sb.dataset.act; if (!l) return; const ov = l.ver, orv = l.rev || 0;
    if (a === 'ver-') l.ver = Math.max(1, l.ver - 1);
    if (a === 'ver+') l.ver += 1;
    if (a === 'rev+') l.rev = orv + 1;
    if (a === 'rev-') l.rev = Math.max(0, orv - 1);
    if (a === 'ver-edit'){ const v = parseInt(prompt('File version', l.ver), 10); if (v > 0) l.ver = v; }
    if (a === 'rev-edit'){ const v = parseInt(prompt('Revisions', orv), 10); if (v >= 0) l.rev = v; }
    if (l.ver !== ov) log(l, 'Edit', 'File Version: v' + ov + ' > v' + l.ver);
    if ((l.rev || 0) !== orv) log(l, 'Edit', 'Revisions: ' + orv + ' > ' + l.rev);
    touch(); render(); return; }
  const t = e.target.closest('.tab'); if (t){ bulkSel.clear(); msearch = ''; document.getElementById('msearch').value = ''; state.tab = t.dataset.tab; if (state.tab === 'reports') auditOpen = {}; if (state.tab === 'todo'){ todoDay = null; todoOpen = null; todoQ = ''; } state.open = {}; save(); render(); return; }
  const ad = e.target.closest('.aud-day'); if (ad){ const d = ad.dataset.day; auditOpen[d] = !(d in auditOpen ? auditOpen[d] : off(d) === 0); render(); return; }
  const ar = e.target.closest('.aud-row'); if (ar){ const l = byId(ar.dataset.id); if (l) openLogo(l); else toast('That logo was deleted.'); return; }
  if (e.target.closest('.bsel, .bsel-all, #bulkBar')) return;   // EP v2.24
  const th = e.target.closest('th[data-sort]'); if (th){ const sk = msearch.trim() ? 'search' : state.tab, k = th.dataset.sort, cur = state.sort[sk] || (th.classList.contains('sorted') ? {k, dir: th.querySelector('.arr').textContent === '\u25b2' ? 1 : -1} : null); state.sort[sk] = {k, dir: cur && cur.k === k ? -cur.dir : 1}; save(); render(); return; }
  const ca = e.target.closest('[data-collapse]'); if (ca){ const c = collapseState(); c.heads.forEach(h => { state.collapsed[h.dataset.sec] = c.open; }); c.days.forEach(x => { auditOpen[x.dataset.day] = !c.open; }); save(); render(); return; }
  const sh = e.target.closest('.sec-head'); if (sh){ const k = sh.dataset.sec; state.collapsed[k] = !state.collapsed[k]; save(); render(); return; }
  if (e.target.id === 'msclear'){ msearch = ''; document.getElementById('msearch').value = ''; render(); return; }
  const r = e.target.closest('.row'); if (r && !e.target.closest('select')){ const id = r.dataset.id, was = !!state.open[id]; state.open = {}; if (!was) state.open[id] = true; delete stripOpen[id]; render(); }   // EP v2.26: only one logo card open at a time
});
document.addEventListener('change', e => { const d = e.target.dataset || {}, isF = 'srtF' in d; if (!isF && !('srtD' in d)) return;   // EP v1.46: a Sorts row's field or direction
  const key = sortKeyNow(), act = activeSorts(key).map(x => ({k:x.k, dir:x.dir})), i = +(isF ? d.srtF : d.srtD); if (!act[i]) return;
  if (isF) act[i].k = e.target.value; else act[i].dir = +e.target.value; setSorts(key, act); });
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('.srt-row'); if (r) srtDrag = +r.dataset.i; });   // drag the ⋮⋮ rows to change the order
document.addEventListener('dragover', e => { if (srtDrag !== null && e.target.closest && e.target.closest('.srt-row')) e.preventDefault(); });
document.addEventListener('drop', e => { const r = e.target.closest && e.target.closest('.srt-row'); if (srtDrag === null || !r) return; e.preventDefault();
  const key = sortKeyNow(), act = activeSorts(key).map(x => ({k:x.k, dir:x.dir})), to = +r.dataset.i, from = srtDrag; srtDrag = null; if (from === to) return;
  const [m] = act.splice(from, 1); act.splice(to, 0, m); setSorts(key, act); });
document.addEventListener('dragend', () => { srtDrag = null; });
document.getElementById('msearch').addEventListener('input', e => { msearch = e.target.value; state.open = {}; render(); });
render();
boot();
</script>
