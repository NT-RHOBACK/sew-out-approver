<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Embroidery Portal</title>
<style>
/* Rhoback brand kit (same as the live portal): Admiral Navy, Old Glory Red, Steel text, #E8ECF0 borders.
   Fonts: Futura PT for headings + tab names, Aptos for body text, tables, and forms (Segoe UI backup). */
:root{--navy:#29304E;--navy-d:#29304E;--navy-h:#49516C;--red:#BF2033;--line:#E8ECF0;--bg:#FAFAFA;--text:#29304E;--grey:#6B7B8D;--lgrey:#9399A6;--pick:#E6EAF6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Aptos','Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
h1,h2,.h2,.tab,.sec-head .name,.brand,.brand-sub,.box h3,.pipe .lbl{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic","Futura",sans-serif}
.header{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--navy)}
.ridge{display:flex;height:26px}.ridge span{width:4px}.ridge .r{background:var(--red)}.ridge .n{background:var(--navy)}
.brand-sub{font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--navy)}
.draft-tag{margin-left:auto;font-size:11px;font-weight:700;background:#fff4d6;border:1px solid #f0d58a;color:#7a5800;border-radius:6px;padding:3px 9px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:14px 18px;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.page{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
h1{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
.h2{font-size:18px;font-weight:700;color:var(--navy);margin:26px 0 4px}
.sub{color:var(--grey);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
.bar input{flex:1;min-width:220px}
.sec{margin-bottom:14px}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;user-select:none}
.sec-head .chev{width:14px;color:var(--grey);font-size:11px}
.sec-head .name{font-size:18px;font-weight:700;color:var(--navy)}
.sec-head .cnt{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--grey)}
.tblwrap{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin:4px 0 6px}
.tbl{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
.tbl td.wrap{white-space:normal;overflow-wrap:anywhere}
.tbl th{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);text-align:left;padding:14px 12px;border-bottom:2px solid var(--navy);background:#fff;cursor:pointer;white-space:nowrap}
.tbl th .arr{color:var(--lgrey);font-size:10px;margin-left:3px}
.tbl th.sorted{color:var(--navy)}.tbl th.sorted .arr{color:var(--navy)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:12px;padding:4px 10px}
.dtp{display:inline-block;font-size:13px;font-weight:600;border-radius:5px;padding:3px 8px}
.dtp.plain{font-weight:400;color:var(--grey);padding-left:0}
.dtp.red{background:#f8d7d7;color:#a61b1b}.dtp.yellow{background:#fdf0c4;color:#7a5800}
.img-pend{color:#e0702a;font-size:15px}.img-ok{color:#2E7D32;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:8px 0 4px}
@media(max-width:900px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pipe .box{margin:0;text-align:center;padding:14px 8px;border-top-width:4px}
.pipe .num{font-size:24px;font-weight:700;color:var(--navy)}
.pipe .lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey);margin-top:4px}
.back{background:none;border:none;color:var(--navy);font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;padding:0}
.demo{font-size:12px;background:#fff4d6;border:1px solid #f0d58a;color:#7a5800;border-radius:6px;padding:8px 12px;margin-bottom:14px}
.fsec{display:inline-block;font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic",sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:#F0F1F3;border-left:5px solid var(--navy);border-radius:3px;padding:8px 14px;margin:20px 0 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.fcard{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.fcard b{display:block;margin-bottom:4px}
.fcard span{font-size:12px;color:var(--grey)}
.usewhen{background:#eaf4f8;border:1px solid #b8dae4;color:#1c5a6a;font-weight:700;font-size:12px;border-radius:6px;padding:8px 10px}
.rednote{background:#fdecec;border:1px solid #f3c4c4;color:#8a1c1c;font-weight:600;font-size:13px;border-radius:6px;padding:9px 12px}
.bluenote{background:#eaf4f8;border:1px solid #b8dae4;color:#1c3a48;font-size:12px;border-radius:6px;padding:9px 12px}
.greennote{background:#eaf6ec;border:1px solid #c5e5cb;color:#256b31;font-weight:700;font-size:12px;border-radius:6px;padding:9px 12px}
.yellownote{background:#fdf6e3;border:1px solid #f0dfaa;color:#7a5a12;font-weight:700;font-size:12px;border-radius:6px;padding:9px 12px}
.fin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
.flbl{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.row{cursor:pointer}.row:hover td{background:#fafbfd}
.row.open td{background:#f3f5fa}
.row .chev{color:var(--grey);font-size:11px;width:12px;display:inline-block}
.logo{font-weight:600;color:var(--navy-d)}
.sdot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;margin-right:7px;vertical-align:1px;flex:none}
.logo-cell{display:flex;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.sbtn{font:inherit;font-size:14px;min-width:38px;height:34px;padding:0 12px;border:1px solid #e3e6ee;border-radius:7px;background:#fff;color:var(--navy-d);cursor:pointer}
.sbtn.txt{font-size:13px;font-weight:700}
.sbtn:hover{border-color:#c4cbe0}
.sval{font-size:18px;font-weight:700;min-width:34px;text-align:center;color:var(--navy-d)}
.rev-num{font-size:20px;font-weight:700;color:var(--red);min-width:22px}.ver{font-size:11px;color:var(--lgrey);margin-left:5px}
.acct{color:#4b5563}
.tag{font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px;background:#eef0f6;color:#49516C}
.tag.dig{background:#e8f0fb;color:#1f5a80}
.dt{font-weight:600;border-radius:5px;padding:2px 7px}
.dt.red{background:#f8d7d7;color:#a61b1b}.dt.yellow{background:#fdf0c4;color:#7a5800}
.muted{color:var(--lgrey)}
.st option{background:#fff;color:#1c2340;font-weight:400}
.st{width:100%;font:inherit;font-size:12px;padding:4px 6px;border:1px solid #d6dbe4;border-radius:6px;background:#fff;color:var(--text);cursor:pointer}
.photo-ok{color:#1a6e2e;font-weight:600}.photo-wait{color:#b45309;font-weight:600}
.card-cell{padding:0!important;background:#f3f5fa}
.card{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:16px 18px 18px 34px;white-space:normal}
@media(max-width:900px){.card{grid-template-columns:1fr;padding-left:18px}}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:12px}
.box h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.box h3 .num{font-family:'Aptos','Segoe UI',sans-serif;background:var(--navy);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.f label{display:block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:#fff}
.f textarea{min-height:44px;resize:vertical}
.f.full{grid-column:1/-1}
.file{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.file:last-of-type{border-bottom:none}
.ftype{font-size:10px;font-weight:700;background:var(--navy);color:#fff;border-radius:4px;padding:2px 6px;min-width:34px;text-align:center}
.fname{flex:1;overflow:hidden;text-overflow:ellipsis}
.btn{font:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;padding:8px 14px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--navy-h);border-color:var(--navy-h)}
.btn.light{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.light:hover{background:#fff;border-color:var(--navy)}
.btn.small{padding:3px 9px;font-size:11px}
.btn.danger{background:#fff;color:var(--red);border-color:#e8c2c7}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:12px;color:var(--grey);margin-top:6px;line-height:1.45}
.hist{font-size:12px}
.hist div{padding:4px 0;border-bottom:1px dashed var(--line)}
.hist div:last-child{border-bottom:none}
.hist b{color:var(--navy)}
.foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.empty{background:#fff;border:1px dashed #d6dbe4;border-radius:8px;padding:18px;text-align:center;color:var(--grey);font-size:13px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.mailhead{font-size:12px;line-height:1.7;background:#f6f7fa;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 0}
.mailhead b{display:inline-block;width:56px;color:var(--grey);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.mailbody{width:100%;height:230px;border:1px solid var(--line);border-radius:6px;background:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
.ok{color:#1a6e2e;font-weight:600}
.legend{margin-top:18px;font-size:12px;color:var(--grey);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;line-height:1.6}

/* ===== v13: match the live portal (script 3566, read 10/21) ===== */
:root{--navy:#29304E;--navy-d:#29304E;--navy-h:#49516C;--red:#BF2033;--line:#E8ECF0;--bg:#FFFFFF;--text:#29304E;--grey:#6B7B8D;--lgrey:#6B7B8D;--light:#FAFAFA;--pick:#E6EAF6;--warn:#E65100}
body{font-family:"Aptos","Segoe UI","Futura PT",futura-pt,sans-serif;background:#FFFFFF;color:#29304E;-webkit-font-smoothing:antialiased}
h1,h2,h3,.h2,.sec-head .name,.brand-sub,.box h3,.card-title,.top-bar,.pipe .stage{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic","Futura",sans-serif}

.header-user{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--navy)}

h1{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:16px}

.bar{gap:12px;margin-bottom:20px}

.sec{margin-bottom:20px}
.sec-head{padding:0;margin-bottom:10px}

.row:hover td{background:#FAFAFA}

/* Submit Request form: live look + Parts 6-7 */
.sf .req{color:var(--red)}
.sf-red{background:#fdecec;border:1px solid #f3c4c4;color:#8a1c1c;font-size:14px;border-radius:6px;padding:12px 16px;line-height:1.5}

<script>
// EP v1.25: Noelle's own Embroidery Portal, for requests that don't all go through the NetSuite portal.
// Layout = the approved logo layout draft v21. Data lives only in "Embroidery Portal.xlsx" in a OneDrive folder
// Noelle picks (File System Access API); attached files go in a "Files" folder beside it. Nothing is sent to GitHub.
const VERSION = 'EP v1.25';
const ME = 'Noelle';
const XLSX_NAME = 'Embroidery Portal.xlsx', FILES_DIR = 'Files', DELETE_DIR = 'DELETE', SEED_NAME = 'portal-logos.json', SEWSENT_NAME = 'sew-sent.json', SUBMITTED_NAME = 'submitted-times.json', TODO_IMPORT_NAME = 'todo-import.json';
const LS_DATA = 'embroideryPortal_data_v1', LS_UI = 'embroideryPortal_ui_v1', SS_TAB = 'embroideryPortal_tab';
const REQUEST_URL  = new URL('../request/', location.href).href;    // the Sew-Out Request page (same repo)
const APPROVER_URL = new URL('../netsuite/', location.href).href;   // the NetSuite copy of the Sew-Out Approver (fills itself in from the link)
const BARRETT_TO = ['Rhobackembroideryteam@barrettdistribution.com', 'carla.gotera@barrettdistribution.com'];
const BARRETT_CC = ['rosemarie.lincoln@barrettdistribution.com', 'paulina.rivas@barrettdistribution.com'];
const DEPTS = ['Wholesale','Special Projects','Collegiate','Mainline','Custom'];
const reqNo = l => l.nsId ? '#' + l.nsId : String(l.id || '');   // request number (EP v1.12)
const deptTag = l => { const bits = [esc(reqNo(l)), esc(l.dept || '')].filter(Boolean); return bits.length ? '<span class="dtag">' + bits.join(' &middot; ') + '</span>' : ''; };   // e.g. #78 · Wholesale
const AUTO = 'System (auto)';   // who, for moves the portal makes on its own

const STATUS_COLORS = {
  'New Request':       {title:'#5b3a8e', bg:'#5b3a8e', fg:'#ffffff'},
  'Digitizing':        {title:'#0f766e', bg:'#d2f0ec', fg:'#0f5f58'},
  'Pending Sew Out':   {title:'#d9822b', bg:'#fdeee2', fg:'#a35a1f'},
  'Review Sew Out':    {title:'#c25e00', bg:'#f6b26b', fg:'#4a2a00'},
  'Sent for Approval': {title:'#3b8fd0', bg:'#e6f3fc', fg:'#1f6fa8'},
  'Waiting on Reply':  {title:'#a88600', bg:'#fff6b3', fg:'#6b5600'},
  'Need to Upload':    {title:'#1f5fbf', bg:'#c6e4f7', fg:'#0b4f80'},
  'Completed':         {title:'#2e7d32', bg:'#e2f5dc', fg:'#2e7d32'},
  'Archive':           {title:'#6b7280', bg:'#d1d1d1', fg:'#333333'}
};
const STATUSES = Object.keys(STATUS_COLORS);
const OPEN_STATUSES = STATUSES.slice(0, 7);
const TABS = [
  {key:'dashboard', title:'Dashboard',     sub:'Every open logo with a red or yellow date: Submitted (7+ business days in the queue) or In Hand Date (14 days away or less, or past).', focus:true},
  {key:'queue',     title:'Queue',          sub:'New Request, Digitizing, and Waiting on Reply.', sections:['New Request','Digitizing','Waiting on Reply']},
  {key:'barrett',   title:'Barrett Queue',  sub:'Sorted by In Hand Date, soonest first.', sections:['Review Sew Out','Pending Sew Out'], extra:{h:'Sew-Out Photo', f:'photo'}, defaultSort:'ih'},
  {key:'approvals', title:'Approvals / Need to Upload', label:'Approvals / Upload', sub:'Sent for Approval (approval sheet sent to the rep) and Need to Upload (approved, waiting to be uploaded to EpicStitch).', sections:['Sent for Approval','Need to Upload'],
     extra:{h:'Sheet Sent', f:'sentDate'}, extraBySection:{'Need to Upload':{h:'Approved', f:'approvedDate'}}, extraMixed:{h:'Sent / Approved', f:'sentOrApproved'}},
  {key:'submit',    title:'Submit Request', sub:'Add a logo request. It starts as New Request in the Queue.', submit:true},
  {key:'completed', title:'Completed',      sub:'Completed and archived logos.', sections:['Completed','Archive'], extra:{h:'Completed', f:'completedDate'}},
  {key:'audit',     title:'Audit', label:'&#128269; Audit', sub:'Every change to every logo, newest first. Today is open; earlier days start closed.', audit:true},
  {key:'todo',      title:'To Do', sub:'Your daily list. Set a task&rsquo;s Status to what you did (it moves to What I did) or Roll over, and click a task for its details and history. Anything not marked rolls over to the next day on its own, and what you submitted for digitization or sew-out comes back the next day as a check-on.', todo:true, right:true}
];
const KIND_COLOR = {Added:['#5b3a8e','#efe8f8'], Status:['#1f5fbf','#e8f0fb'], Email:['#7b2fb5','#f2e8fb'], Edit:['#49516C','#eef0f6'], File:['#a35a1f','#fdeee2'], Note:['#2e7d32','#e2f5dc'], Deleted:['#a61b1b','#f8d7d7']};

// ---------------- Dates ----------------
let today;
function refreshToday(){ today = new Date(); today.setHours(0,0,0,0); }
refreshToday();
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayIso = () => isoOf(new Date());
const nowStamp = () => { const d = new Date(); return isoOf(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const parseIso = s => { const m = String(s || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
function normDate(v){ const t = String(v || '').trim(); if (!t) return ''; if (/^\d{4}-\d{1,2}-\d{1,2}/.test(t)){ const d = parseIso(t); return isoOf(d); }
  const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/); if (m){ const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; return isoOf(new Date(y, m[1]-1, +m[2])); } return t; }
const off = s => { const d = parseIso(s); return d ? Math.round((d - today) / 86400000) : null; };   // days from today (negative = past)
const fmt = s => { const d = parseIso(s); return d ? pad(d.getMonth()+1) + '/' + pad(d.getDate()) + '/' + String(d.getFullYear()).slice(2) : ''; };   // 10/20/26
const time12 = ts => { const m = String(ts || '').match(/T(\d{2}):(\d{2})/); if (!m) return ''; const h = +m[1]; return ((h % 12) || 12) + ':' + m[2] + (h < 12 ? ' AM' : ' PM'); };
function bizDays(n){ if (n < 0) return -1; let c = 0; const d = new Date(today); for (let i = 0; i < n; i++){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w && w !== 6) c++; } return c; }
function urg(n){ if (n === null || n === undefined) return ''; if (n < 0 || bizDays(n) <= 4) return 'red'; if (n <= 14) return 'yellow'; return ''; }   // In Hand Date
const DONE = ['Completed','Archive'], SUB_MET = ['Need to Upload','Completed','Archive'];
const FOCUS_LIMIT = 10;   // Today's Focus shows this many, then "Show all" (EP v1.25)
function bizSince(s){ const d = parseIso(s); if (!d) return 0; let c = 0; while (d < today){ d.setDate(d.getDate() + 1); const w = d.getDay(); if (w && w !== 6) c++; } return c; }   // business days in the queue since s (weekends don't count)
function subUrg(l){ if (SUB_MET.includes(l.status) || !l.submitted) return ''; const n = bizSince(l.submitted); return n >= 10 ? 'red' : n >= 7 ? 'yellow' : ''; }   // Submitted: yellow after 7-9 business days, red after 10+
function needsAttention(l){ if (DONE.includes(l.status)) return false; const s = off(l.submitted), ih = off(l.inHand); return (s !== null && -s >= 14) || (ih !== null && ih <= 14); }
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ---------------- Data (mirrored in this browser; the Excel file is the record) ----------------
let DB = {logos:[], history:[], notes:[], notifs:[], tasks:[], did:[], todoDays:[], taskLog:[], savedAt:''};
try { const s = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (s && Array.isArray(s.logos)) DB = Object.assign({logos:[], history:[], notes:[], notifs:[], tasks:[], did:[], todoDays:[], taskLog:[], savedAt:''}, s); } catch(e){}
const byId = id => DB.logos.find(l => String(l.id) === String(id));
function newId(){ const n = DB.logos.concat(DB.history).reduce((m, x) => Math.max(m, parseInt(String(x.id || '').replace(/\D/g, ''), 10) || 0), 0); return 'EP-' + String(n + 1).padStart(4, '0'); }
function blankLogo(){ return {id:'', nsId:'', logo:'', account:'', rep:'', type:'Sew-Out', dept:'', status:'New Request', submitted:todayIso(), inHand:'', size:'', sizeNotes:'', count:'', colorType:'', threadNotes:'', placement:'',
  ver:1, rev:0, scratch:false, submitNotes:'', sewSentDate:'', sewSentTime:'', sentDate:'', approvedDate:'', completedDate:'', files:[], dir:'', sewReq:null, sheetFile:''}; }
function log(l, kind, what, by){ DB.history.push({ts:nowStamp(), id:l.id, logo:l.logo, account:l.account, kind, what, by:by || ME}); }
function setStatus(l, st, by){
  if (l.status === st) return;
  log(l, 'Status', 'Status: ' + l.status + ' > ' + st, by); l.status = st;
  tdFromPortal(l, st);   // EP v1.24: also lands in today's To Do / What I did
  if (st === 'Sent for Approval' && !l.sentDate) l.sentDate = todayIso();
  if (st === 'Need to Upload' && !l.approvedDate) l.approvedDate = todayIso();
  if (st === 'Completed' && !l.completedDate) l.completedDate = todayIso();
}
function touch(){ DB.savedAt = new Date().toISOString(); dirty = true; try { localStorage.setItem(LS_DATA, JSON.stringify(DB)); } catch(e){} scheduleSave(); }
const photoIn = l => { const d = sentStamp(l).slice(0, 10); return !!d && (l.files || []).some(f => /\.(jpe?g|png|heic|webp|gif)$/i.test(f.name) && (f.added || '') >= d); };
// Sew-out clock (EP v1.04): Follow Up when it's still Pending Sew Out with no sew-out photo 24 business hours after it was sent to Barrett (weekends don't count)
const FOLLOW_UP = 'Follow Up';

function readWorkbook(buf){

    const l = blankLogo(), get = h => { const i = head.indexOf(h); return i < 0 ? '' : String(r[i] == null ? '' : r[i]).trim(); };

    l.ver = parseInt(l.ver, 10) || 1; l.rev = parseInt(l.rev, 10) || 0; l.scratch = /^y/i.test(l.scratch);
    const ss = String(l.sewSentDate || ''), tm = ss.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);

    ['submitted','inHand','sewSentDate','sentDate','approvedDate','completedDate'].forEach(k => { l[k] = normDate(l[k]); });
    const st = STATUSES.find(s => s.toLowerCase() === String(l.status).toLowerCase()); if (st) l.status = st;
    try { const x = JSON.parse(get(COLS[COLS.length - 1][0]) || '{}'); l.files = x.files || []; l.dir = x.dir || ''; l.sewReq = x.sewReq || null; l.sheetFile = x.sheetFile || ''; } catch(e){}
    if (!l.id) l.id = 'EP-X' + Math.random().toString(36).slice(2, 7);

  rows('Notifications').slice(1).filter(r => r[0]).forEach(r => db.notifs.push({ts:String(r[0]) + 'T' + String(r[1] || '00:00:00'), id:String(r[2]), text:String(r[3]), read:/^y/i.test(String(r[4]))}));
  rows('To Do').slice(1).filter(r => r[0]).forEach(r => db.tasks.push(Object.assign({day:normDate(r[0]), sec:String(r[1]), text:String(r[2]), state:/^done/i.test(r[3]) ? 'done' : /^rolled/i.test(r[3]) ? 'rolled' : '', doneSec:String(r[4] || ''), ts:String(r[5] || ''), id:String(r[6] || tdId())}, r[7] ? {chain:String(r[7])} : {}, r[8] === 'none' ? {noLink:true} : r[8] ? {logoId:String(r[8])} : {}, /end of day/i.test(r[3]) ? {auto:true} : {})));
  rows('What I Did').slice(1).filter(r => r[0]).forEach(r => db.did.push(Object.assign({day:normDate(r[0]), sec:String(r[1]), text:String(r[2]), ts:String(r[3] || ''), id:String(r[4] || tdId()), taskId:String(r[5] || '')}, r[6] ? {chain:String(r[6])} : {}, r[7] === 'none' ? {noLink:true} : r[7] ? {logoId:String(r[7])} : {})));

const FS_OK = 'showDirectoryPicker' in window;

  o.onsuccess = () => { const t = o.result.transaction('kv', mode), r = fn(t.objectStore('kv')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }; o.onerror = () => rej(o.error); });

function setSave(s){

// ---------------- To Do (EP v1.17+): Noelle's daily list (this portal only) ----------------
const TODO_SECS = ['Request sew out','Review Barrett Sew Out','Add to ES/FTP','Other','Check on digitization','Check on Sew out requests','Waiting on Barrett'];   // EP v1.24: Waiting on Barrett replaces Waiting on thread colors

const DONE_DEFAULT = {'Request sew out':'Requested Sew Out', 'Review Barrett Sew Out':'Sent for approval', 'Add to ES/FTP':'Added to ES/FTP', 'Other':'Other',
  'Check on digitization':'Requested Sew Out', 'Check on Sew out requests':'Sent for approval', 'Waiting on Barrett':'Sent for approval'};
const NEXT_CHECK = {'Submitted for digitization':'Check on digitization', 'Requested Sew Out':'Check on Sew out requests'};   // what you did → the next day's list
// Status colors for the task banners (EP v1.23): [background, text, border]
const TD_COLORS = {'To do':['#ffffff','#29304E','#d6dbe4'], 'Rolled over':['#ece6f8','#5b3a8e'], 'Submitted for digitization':['#d2f0ec','#0f5f58'], 'Sent for approval':['#e6f3fc','#1f6fa8'],
  'Reviewed new requests':['#e8eaf6','#3949ab'], 'Requested Sew Out':['#fdeee2','#a35a1f'], 'Added to ES/FTP':['#c6e4f7','#0b4f80'], 'Followed up on':['#fff6b3','#6b5600'], 'Completed':['#e2f5dc','#2e7d32'], 'Other':['#eef0f6','#49516C']};
let todoDay = null, todoOpen = null, todoQ = '';   // day shown, task opened (single click), search across every day
const tdId = () => 'T' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const tdTasks = d => (DB.tasks || []).filter(t => t.day === d);
const tdDid = d => (DB.did || []).filter(x => x.day === d);
const dayName = d => { const x = parseIso(d); return x ? x.toLocaleDateString('en-US', {weekday:'short', month:'numeric', day:'numeric'}) : d; };   // Wed, 10/28
const longDay = d => { const x = parseIso(d); return x ? x.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : d; };   // Oct 28, 2026
const tdLines = text => { const [first, ...rest] = String(text || '').split('\n'); return {first, subs:rest.map(s => s.trim()).filter(Boolean)}; };
const tdHtml = text => { const t = tdLines(text); return esc(t.first) + (t.subs.length ? '<ol type="a" class="td-sub">' + t.subs.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' : ''); };
const tdOpts = (list, sel) => list.map(s => '<option' + (s === sel ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
const tdReady = () => dirHandle && saveState !== 'reconnect' && saveState !== 'local';
// Task history (EP v1.20): every task keeps one chain id as it rolls over or comes back as a check-on
const tdChainOf = o => o.chain || (o.chain = o.id);
function tlog(o, what){ (DB.taskLog = DB.taskLog || []).push({ts:nowStamp(), chain:tdChainOf(o), task:tdLines(o.text).first, what}); }
const tdEvents = o => { const c = tdChainOf(o); return (DB.taskLog || []).map((e, i) => [e, i]).filter(x => x[0].chain === c).sort((x, y) => y[0].ts.localeCompare(x[0].ts) || y[1] - x[1]).map(x => x[0]); };   // newest first
const tdRolls = o => tdEvents(o).filter(e => /^Rolled over/.test(e.what)).length;
// Steps (EP v1.23): one task can go through several What I did sections in a day; the latest one is where it is now
const tdKey = x => x.day + '|' + (x.taskId ? 't:' + x.taskId : 'c:' + tdChainOf(x));
const tdSteps = x => { const k = tdKey(x); return (DB.did || []).map((y, i) => [y, i]).filter(p => tdKey(p[0]) === k).sort((a, b) => a[0].ts.localeCompare(b[0].ts) || a[1] - b[1]).map(p => p[0]); };   // oldest first
const tdTaskSteps = t => tdSteps({day:t.day, taskId:t.id});
const tdCurrent = x => { const s = tdSteps(x); return s[s.length - 1] || x; };
function tdSync(t){ const s = tdTaskSteps(t); if (s.length){ t.state = 'done'; t.doneSec = s[s.length - 1].sec; delete t.auto; } else if (t.state === 'done'){ t.state = ''; t.doneSec = ''; } }
function tdAddStep(o, sec){   // o: a To Do task, or a What I did item
  const t = (DB.tasks || []).includes(o) ? o : (o.taskId && (DB.tasks || []).find(y => y.id === o.taskId));
  const first = t ? !tdTaskSteps(t).length : false;
  const y = {id:tdId(), day:o.day, sec, text:o.text, ts:nowStamp(), taskId:t ? t.id : '', chain:tdChainOf(t || o)}; if ((t || o).logoId) y.logoId = (t || o).logoId;
  (DB.did = DB.did || []).push(y); tlog(t || o, (first ? 'Done' : 'Next step') + ' → ' + sec); if (t) tdSync(t);
  return y;
}

// Logo links (EP v1.24): a task or What I did item can point at a logo in the portal (by name, or picked by hand)
const PORTAL_TO_DID = {'New Request':'Reviewed new requests', 'Digitizing':'Submitted for digitization', 'Pending Sew Out':'Requested Sew Out', 'Sent for Approval':'Sent for approval',
  'Waiting on Reply':'Followed up on', 'Completed':'Added to ES/FTP'};   // portal status change → What I did section
const tdNorm = x => String(x || '').trim().toLowerCase();
function tdLogo(o){   // the linked logo, linking by exact name the first time if nothing was picked
  if (o.logoId) return byId(o.logoId) || null;
  if (o.noLink) return null;
  const name = tdNorm(tdLines(o.text).first), l = name && DB.logos.find(z => tdNorm(z.logo) === name);
  if (l){ o.logoId = l.id; return l; } return null;
}
function tdFromPortal(l, st){   // a logo's status changed in the portal → today's To Do / What I did
  const sec = PORTAL_TO_DID[st]; if (!sec || !tdReady()) return;
  DB.tasks = DB.tasks || []; DB.did = DB.did || [];
  const today = todayIso(), task = tdTasks(today).find(t => tdLogo(t) === l);
  if (task){ const cur = tdTaskSteps(task).pop(); if (cur && cur.sec === sec) return; const y = tdAddStep(cur || task, sec); y.logoId = l.id; tlog(task, 'From the portal: ' + l.logo + ' moved to ' + st); return; }
  const w = tdDid(today).filter(x => !x.taskId && tdLogo(x) === l).map(tdCurrent).pop();
  if (w){ if (w.sec === sec) return; const y = tdAddStep(w, sec); y.logoId = l.id; tlog(w, 'From the portal: ' + l.logo + ' moved to ' + st); return; }
  const y = {id:tdId(), day:today, sec, text:l.logo, ts:nowStamp(), taskId:'', logoId:l.id}; DB.did.push(y); tlog(y, 'From the portal: ' + l.logo + ' moved to ' + st + ' (added to What I did)');

function tdMigrate(){ let n = 0; (DB.tasks || []).forEach(t => { if (t.sec === 'Waiting on thread colors'){ t.sec = 'Waiting on Barrett'; tlog(t, 'Moved to Waiting on Barrett'); n++; } }); return n; }

// A new day: anything not marked rolls over, and where each task ended up yesterday can come back as a check-on
function startTodo(){
  DB.tasks = DB.tasks || []; DB.did = DB.did || []; DB.todoDays = DB.todoDays || [];
  const today = todayIso(); if (DB.todoDays.includes(today)) return false;
  const prev = [...new Set(DB.tasks.map(t => t.day).concat(DB.did.map(x => x.day)))].filter(d => d < today).sort().pop();
  DB.todoDays.push(today);
  if (prev){
    const have = new Set(), add = (sec, text, chain, note, from) => { const k = sec + '|' + String(text).trim().toLowerCase(); if (have.has(k)) return; have.add(k);
      const t = {id:tdId(), day:today, sec, text, state:'', doneSec:'', ts:nowStamp(), chain}; if (from && from.logoId) t.logoId = from.logoId; if (from && from.noLink) t.noLink = true; DB.tasks.push(t); if (note) tlog(t, note); };
    tdTasks(prev).forEach(t => { if (!t.state){ t.state = 'rolled'; t.auto = true; tlog(t, 'Rolled over (end of day)'); } if (t.state === 'rolled') add(t.sec, t.text, tdChainOf(t), '', t); });
    const latest = {}; tdDid(prev).forEach(x => { latest[tdKey(x)] = tdCurrent(x); });   // only the most recent step counts
    Object.values(latest).forEach(x => { if (!NEXT_CHECK[x.sec]) return; const src = x.taskId && DB.tasks.find(t => t.id === x.taskId);   // a done task carries its original name
      add(NEXT_CHECK[x.sec], src ? src.text : x.text, src ? tdChainOf(src) : tdChainOf(x), 'Added as a check-on (' + NEXT_CHECK[x.sec] + ') after ' + x.sec + ' on ' + dayName(prev), src || x); });
  }
  return true;
}

// todo-import.json (from Claude): fills a day that has no tasks yet ("replace" starts the day over), then empties the file
async function applyTodoImport(){
  let o; try { o = JSON.parse(await (await (await dirHandle.getFileHandle(TODO_IMPORT_NAME)).getFile()).text()); } catch(e){ return; }
  if (!o || !o.day || !Array.isArray(o.tasks)) return;
  DB.tasks = DB.tasks || []; DB.did = DB.did || []; DB.todoDays = DB.todoDays || [];
  if (o.replace){   // EP v1.22: start the day over
    tdTasks(o.day).forEach(t => tlog(t, 'Removed (list started over)')); tdDid(o.day).forEach(x => { if (!x.taskId) tlog(x, 'Removed (list started over)'); });
    DB.tasks = DB.tasks.filter(t => t.day !== o.day); DB.did = DB.did.filter(x => x.day !== o.day);
  }
  if (!tdTasks(o.day).length){
    o.tasks.forEach(x => { const t = {id:tdId(), day:o.day, sec:x.sec, text:x.text, state:'', doneSec:'', ts:nowStamp()}; DB.tasks.push(t); tlog(t, 'Added to To Do (' + x.sec + ', from your Google Doc list)');
      if (x.doneAs){ const y = tdAddStep(t, x.doneAs); if (x.didText) y.text = x.didText; } });
    (o.did || []).forEach(x => { const y = {id:tdId(), day:o.day, sec:x.sec, text:x.text, ts:nowStamp(), taskId:''}; DB.did.push(y); tlog(y, 'Written in on What I did (' + x.sec + ')'); });
    if (!DB.todoDays.includes(o.day)) DB.todoDays.push(o.day);
    touch(); if (state.tab === 'todo'){ const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render(); }
    if (o.replace) toast('Today&rsquo;s To Do list was started over.');
  }
  try { const w = await (await dirHandle.getFileHandle(TODO_IMPORT_NAME)).createWritable(); await w.write('{}'); await w.close(); } catch(e){}
}

function tdResults(q){   // every day, newest first; click one to go to it

  if (e.key === 'Enter' && !e.shiftKey && e.target && (e.target.id === 'tdText' || e.target.id === 'didText')){ e.preventDefault(); const b = document.querySelector('[data-td="' + (e.target.id === 'tdText' ? 'add' : 'addDid') + '"]'); if (b) b.click(); }

// Status dropdown on a banner
document.addEventListener('change', e => {
  const s = e.target.closest && e.target.closest('select[data-tdst]'); if (!s || state.tab !== 'todo') return;
  const tab = TABS.find(x => x.key === 'todo'), v = s.value, id = s.dataset.id;
  if (!tdReady()){ toast('Reconnect Excel first (top right), so your list saves.'); renderTodo(tab); return; }
  if (s.dataset.tdst === 'task'){ const t = (DB.tasks || []).find(x => x.id === id); if (!t) return;
    if (v === 'To do'){ if (t.state === 'rolled'){ t.state = ''; delete t.auto; tlog(t, 'Undo roll over'); } }
    else if (v === 'Rolled over'){ t.state = 'rolled'; delete t.auto; tlog(t, 'Rolled over'); }
    else { tdAddStep(t, v); if (todoOpen === t.id) todoOpen = null; toast('Moved to What I did &rarr; ' + esc(v) + '.'); }
  } else { const x = (DB.did || []).find(y => y.id === id); if (!x || v === x.sec) return; const y = tdAddStep(x, v); if (todoOpen === x.id) todoOpen = y.id; }
  touch(); renderTodo(tab);
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-td]'); if (!el || state.tab !== 'todo') return;
  if (el.dataset.td === 'open' && e.target.closest('.td-card, select, textarea, input, button')) return;
  const k = el.dataset.td, id = el.dataset.id, tab = TABS.find(x => x.key === 'todo');
  const t = id ? (DB.tasks || []).find(x => x.id === id) : null, w = id ? (DB.did || []).find(x => x.id === id) : null;
  const redraw = () => renderTodo(tab);
  if (k === 'open'){ todoOpen = todoOpen === id ? null : id; redraw(); return; }
  if (k === 'day'){ if (el.dataset.v){ todoDay = el.dataset.v; todoOpen = null; redraw(); } return; }
  if (k === 'view'){ state.todoView = el.dataset.v; todoOpen = null; save(); redraw(); return; }
  if (k === 'goto'){ todoDay = el.dataset.day; state.todoView = el.dataset.v; todoQ = ''; todoOpen = id; save(); redraw();
    const c = document.querySelector('.td-card'); if (c) c.scrollIntoView({block:'center'}); return; }
  if (k === 'copyTodo' || k === 'copyDid'){ const c = k === 'copyTodo' ? tdCopy(TODO_SECS, tdTasks(todoDay), '') : tdCopy(DID_SECS, tdDid(todoDay).sort((a, b) => a.ts.localeCompare(b.ts)), longDay(todoDay));
    toast(await copyHtml(c.html, c.text) ? '&#10003; Copied. Paste it into your email or Teams.' : 'Couldn&rsquo;t copy. Try again.'); return; }
  if (!tdReady()){ toast('Reconnect Excel first (top right), so your list saves.'); return; }
  if (k === 'add' || k === 'addDid'){ const isDid = k === 'addDid', ta = document.getElementById(isDid ? 'didText' : 'tdText'), text = ta.value.replace(/\s+$/, ''); if (!text.trim()) return;
    const sec = document.getElementById(isDid ? 'didSec' : 'tdSec').value;
    if (isDid){ const y = {id:tdId(), day:todoDay, sec, text, ts:nowStamp(), taskId:''}; (DB.did = DB.did || []).push(y); tlog(y, 'Written in on What I did (' + sec + ')'); }
    else { const y = {id:tdId(), day:todoDay, sec, text, state:'', doneSec:'', ts:nowStamp()}; (DB.tasks = DB.tasks || []).push(y); tlog(y, 'Added to To Do (' + sec + ')'); }
    touch(); redraw(); const n = document.getElementById(isDid ? 'didSec' : 'tdSec'); n.value = sec; document.getElementById(isDid ? 'didText' : 'tdText').focus(); return; }
  if (k === 'save' && (t || w)){ const o = t || w, text = document.getElementById('ed-text-' + id).value.replace(/\s+$/, ''); if (!text.trim()) return;
    const secEl = document.getElementById('ed-sec-' + id), sec2 = secEl ? secEl.value : o.sec, ch = [];
    if (text !== o.text) ch.push('Renamed: "' + tdLines(o.text).first + '" > "' + tdLines(text).first + '"'); if (sec2 !== o.sec) ch.push('Moved to ' + sec2);
    if (ch.length){ const src = w && w.taskId && (DB.tasks || []).find(x => x.id === w.taskId); tlog(src || o, ch.join('; ')); }
    o.text = text; o.sec = sec2; touch(); redraw(); toast('Saved.'); return; }
  if (k === 'openLogo' && (t || w)){ const o = t || w, src = w && w.taskId && (DB.tasks || []).find(x => x.id === w.taskId), l = tdLogo(src || o); if (l) openLogo(l); return; }
  if ((k === 'link' || k === 'unlink') && (t || w)){ const o0 = t || w, o = (w && w.taskId && (DB.tasks || []).find(x => x.id === w.taskId)) || o0;
    if (k === 'unlink'){ const l = tdLogo(o); delete o.logoId; o.noLink = true; tdSteps(o0).forEach(x => { delete x.logoId; x.noLink = true; }); if (l) tlog(o, 'Unlinked from ' + l.logo); }
    else { const v = tdNorm(document.getElementById('link-' + o0.id).value), l = DB.logos.find(z => tdNorm(reqNo(z) + ' ' + z.logo) === v || tdNorm(z.logo) === v || tdNorm(reqNo(z)) === v || (v && tdNorm(reqNo(z)) === '#' + v));
      if (!l){ toast('No logo with that name or request #.'); return; } o.logoId = l.id; delete o.noLink; tdSteps(o0).forEach(x => { x.logoId = l.id; delete x.noLink; }); tlog(o, 'Linked to ' + l.logo + ' (' + reqNo(l) + ')'); }
    touch(); redraw(); return; }
  if (k === 'undoRoll' && t){ t.state = ''; delete t.auto; tlog(t, 'Undo roll over'); touch(); redraw(); return; }
  if (k === 'undoStep' && w){ const steps = tdSteps(w), last = steps[steps.length - 1], src = w.taskId && (DB.tasks || []).find(x => x.id === w.taskId);
    DB.did = DB.did.filter(x => x !== last); tlog(src || last, 'Undo step (' + last.sec + ')'); if (src) tdSync(src);
    const left = steps.slice(0, -1); todoOpen = left.length ? left[left.length - 1].id : null;
    touch(); redraw(); toast(left.length ? 'Undone. It&rsquo;s back in ' + esc(left[left.length - 1].sec) + '.' : src ? 'Undone. It&rsquo;s back on your To Do list.' : 'Undone.'); return; }
  if (k === 'del' && (t || (w && !w.taskId))){ if (!confirm('Remove this from the list?')) return;
    if (t){ tlog(t, 'Removed'); DB.tasks = DB.tasks.filter(x => x !== t); DB.did = (DB.did || []).filter(x => x.taskId !== t.id); }
    else { const steps = tdSteps(w); tlog(w, 'Removed'); DB.did = DB.did.filter(x => !steps.includes(x)); }
    todoOpen = null; touch(); redraw(); return; }
});

function renderMasterSearch(){
  const q = msearch.trim().toLowerCase(), hits = DB.logos.filter(l => matchQ(l, q));
  const tab = {key:'search', sections:STATUSES, extra:null};
  let html = '<h1>Search results</h1><div class="sub">' + hits.length + ' logo' + (hits.length === 1 ? '' : 's') + ' matching &ldquo;' + esc(msearch.trim()) + '&rdquo; in every tab, including Completed and Archive. Click a row to open it. Clear the search or click a tab to go back.</div>';
  const groups = TABS.filter(t => t.sections).map(t => [t.label || t.title, hits.filter(l => t.sections.includes(l.status))]).filter(g => g[1].length);
  html += groups.length ? groups.map(([name, items]) => { const ck = 'search|' + name, closed = !!state.collapsed[ck];
    return '<div class="sec"><div class="sec-head" data-sec="' + esc(ck) + '"><span class="chev">' + (closed ? '&#9656;' : '&#9662;') + '</span><span class="name">' + name + '</span><span class="cnt">' + items.length + '</span></div>' + (closed ? '' : rowsHtml(items, tab, columns(tab, null))) + '</div>'; }).join('')
    : '<div class="empty">No logos match.</div>';
  document.getElementById('page').innerHTML = html;
}
// Notifications (EP v1.10): stay until marked read
let notifOpen = false;
function renderNotifs(){
  const list = (DB.notifs || []).slice().sort((a, b) => b.ts.localeCompare(a.ts)), unread = list.filter(n => !n.read).length;
  const badge = document.getElementById('notifN'); badge.hidden = !unread; badge.textContent = unread > 99 ? '99+' : unread;
  const panel = document.getElementById('notifPanel'); panel.hidden = !notifOpen; if (!notifOpen) return;
  panel.innerHTML = '<div class="notif-head"><span>Notifications</span>' + (unread ? '<button class="btn light small" data-nf="all">Mark all read</button>' : '') + '</div>' +
    (list.length ? list.slice(0, 50).map(n => '<div class="notif-item' + (n.read ? '' : ' unread') + '" data-nf="open" data-ts="' + esc(n.ts) + '" data-id="' + esc(n.id) + '"><span class="nt">' + esc(n.text) +
      '<span class="nwhen">' + fmt(n.ts) + ' ' + time12(n.ts) + '</span></span>' + (n.read ? '' : '<button class="btn light small" data-nf="read" data-ts="' + esc(n.ts) + '" data-id="' + esc(n.id) + '">Mark read</button>') + '</div>').join('')
      : '<div class="notif-empty">No notifications yet.</div>');
}
const findNotif = el => (DB.notifs || []).find(n => n.ts === el.dataset.ts && n.id === el.dataset.id);
document.addEventListener('click', e => {
  if (e.target.closest('#notifBtn')){ notifOpen = !notifOpen; renderNotifs(); return; }
  const el = e.target.closest('[data-nf]');
  if (el){ const k = el.dataset.nf;
    if (k === 'all'){ (DB.notifs || []).forEach(n => { n.read = true; }); touch(); renderNotifs(); return; }
    const n = findNotif(el); if (!n) return;
    if (k === 'read'){ n.read = true; touch(); renderNotifs(); return; }
    if (k === 'open'){ n.read = true; touch(); notifOpen = false; renderNotifs(); const l = byId(n.id); if (l) openLogo(l); else toast('That logo isn&rsquo;t in your portal anymore.'); return; }
  }
  if (notifOpen && !e.target.closest('#notifPanel')){ notifOpen = false; renderNotifs(); }
}, true);
function render(){
  refreshToday(); renderNotifs();
  document.getElementById('tabs').innerHTML = TABS.map(t => '<button class="tab' + (t.key === state.tab && !msearch.trim() ? ' on' : '') + (t.right ? ' tab-right' : '') + '" data-tab="' + t.key + '">' + (t.label || t.title) + '</button>').join('');
  let dl = document.getElementById('acctList'); if (!dl){ dl = document.createElement('datalist'); dl.id = 'acctList'; document.body.appendChild(dl); }
  dl.innerHTML = [...new Set(DB.logos.map(l => l.account).filter(Boolean))].sort().map(a => '<option value="' + esc(a) + '">').join('');
  showBanner();
  if (msearch.trim()){ renderMasterSearch(); return; }
  const tab = TABS.find(t => t.key === state.tab);
  if (tab.audit){ renderAudit(tab); return; }
  if (tab.todo){ renderTodo(tab); return; }
  if (tab.submit){ renderSubmit(tab); return; }
  const group = state.group[tab.key] || 'status';
  let html = (tab.focus ? pipelineHtml() + '<div class="lcard">' + cardHead('Today&rsquo;s Focus') + '<div class="sub" style="margin:-8px 0 16px">' + tab.sub + ' Click a row to open it.</div>'
                        : '<h1>' + tab.title + '</h1><div class="sub">' + tab.sub + ' Click a row to open it. Click a column name to sort.</div>') +
    (tab.focus ? '' : '<div class="bar"><input id="search" placeholder="Search account, logo, sales rep, or request #&hellip;" value="' + esc(state.search[tab.key] || '') + '">' +
    '<select id="group"><option value="status"' + (group === 'status' ? ' selected' : '') + '>Group by: Status</option><option value="account"' + (group === 'account' ? ' selected' : '') + '>Group by: Account</option><option value="rep"' + (group === 'rep' ? ' selected' : '') + '>Group by: Sales Rep</option><option value="none"' + (group === 'none' ? ' selected' : '') + '>No grouping</option></select>' +
    '<button class="btn light" id="reset">Reset filters</button></div>');
  let list = tab.sections ? DB.logos.filter(l => tab.sections.includes(l.status)) : DB.logos.filter(l => !DONE.includes(l.status) && (subUrg(l) || urg(off(l.inHand))));   // EP v1.25: all red + yellow
  if (!tab.focus){ const q = (state.search[tab.key] || '').toLowerCase(); list = list.filter(l => matchQ(l, q)); }
  let groups;
  if (!tab.sections || group === 'none') groups = [[tab.sections ? 'All' : null, list]];
  else if (group === 'status'){ groups = tab.sections.map(s => [s, list.filter(l => l.status === s && !(tab.key === 'barrett' && sewLate(l)))]); if (tab.key === 'barrett') groups.unshift([FOLLOW_UP, list.filter(sewLate)]); }
  else { const keyOf = l => (group === 'account' ? l.account : l.rep) || '(blank)'; const keys = [...new Set(list.map(keyOf))].sort(); groups = keys.map(k => [k, list.filter(l => keyOf(l) === k)]); }
  html += groups.map(([name, items]) => {
    if (name === null && tab.focus && items.length > FOCUS_LIMIT) return rowsHtml(items, tab, columns(tab, null), state.focusAll ? 0 : FOCUS_LIMIT) +
      '<div class="focus-more"><button class="btn light small" id="focusMore">' + (state.focusAll ? 'Show less' : 'Show all ' + items.length) + '</button></div>';
    if (name === null) return items.length ? rowsHtml(items, tab, columns(tab, null)) : '<div class="empty">' + (DB.logos.length ? 'Nothing needs attention right now.' : 'No logos yet. Add one in the Submit Request tab.') + '</div>';
    const ck = tab.key + '|' + group + '|' + name, closed = !!state.collapsed[ck];
    return '<div class="sec"><div class="sec-head" data-sec="' + esc(ck) + '"><span class="chev">' + (closed ? '&#9656;' : '&#9662;') + '</span><span class="name" style="color:' + (name === FOLLOW_UP && group === 'status' ? '#a61b1b' : (group === 'status' && STATUS_COLORS[name]) ? STATUS_COLORS[name].title : 'var(--navy)') + '">' + esc(name) + '</span><span class="cnt">' + items.length + '</span>' +
      (name === FOLLOW_UP && group === 'status' ? '<span style="font-size:12px;color:#49516C">Sew-out not back 24 business hours after it was sent to Barrett (weekends don&rsquo;t count)</span>' : '') + '</div>' +
      (closed ? '' : (items.length ? rowsHtml(items, tab, columns(tab, name)) : '<div class="empty">No logos here.</div>')) + '</div>';
  }).join('');
  if (tab.focus) html += '</div>';
  document.getElementById('page').innerHTML = html;
  const s = document.getElementById('search'); if (s) s.oninput = () => { state.search[tab.key] = s.value; save(); const pos = s.selectionStart; render(); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(pos, pos); };
  const fm = document.getElementById('focusMore'); if (fm) fm.onclick = () => { state.focusAll = !state.focusAll; save(); render(); };
  const g = document.getElementById('group'); if (g) g.onchange = () => { state.group[tab.key] = g.value; save(); render(); };
  const rs = document.getElementById('reset'); if (rs) rs.onclick = () => { delete state.sort[tab.key]; delete state.group[tab.key]; delete state.search[tab.key]; save(); render(); };
}
document.addEventListener('click', e => {
  const ht = e.target.closest('.hist-toggle');
  if (ht){ const body = ht.nextElementSibling, open = body.style.display !== 'none'; body.style.display = open ? 'none' : ''; ht.querySelector('.hchev').innerHTML = open ? '&#9656;' : '&#9662;'; return; }   // History starts closed every time a logo opens
  const sb = e.target.closest('.sbtn');
  if (sb){ const l = byId(sb.dataset.id), a = sb.dataset.act; if (!l) return; const ov = l.ver, orv = l.rev || 0;
    if (a === 'ver-') l.ver = Math.max(1, l.ver - 1);
    if (a === 'ver+') l.ver += 1;
    if (a === 'rev+') l.rev = orv + 1;
    if (a === 'rev-') l.rev = Math.max(0, orv - 1);
    if (a === 'ver-edit'){ const v = parseInt(prompt('File version', l.ver), 10); if (v > 0) l.ver = v; }
    if (a === 'rev-edit'){ const v = parseInt(prompt('Revisions', orv), 10); if (v >= 0) l.rev = v; }
    if (l.ver !== ov) log(l, 'Edit', 'File Version: v' + ov + ' > v' + l.ver);
    if ((l.rev || 0) !== orv) log(l, 'Edit', 'Revisions: ' + orv + ' > ' + l.rev);
    touch(); render(); return; }
  const t = e.target.closest('.tab'); if (t){ msearch = ''; document.getElementById('msearch').value = ''; state.tab = t.dataset.tab; if (state.tab === 'audit') auditOpen = {}; if (state.tab === 'todo'){ todoDay = null; todoOpen = null; todoQ = ''; } state.open = {}; save(); render(); return; }
  const ad = e.target.closest('.aud-day'); if (ad){ const d = ad.dataset.day; auditOpen[d] = !(d in auditOpen ? auditOpen[d] : off(d) === 0); render(); return; }
  const ar = e.target.closest('.aud-row'); if (ar){ const l = byId(ar.dataset.id); if (l) openLogo(l); else toast('That logo was deleted.'); return; }
  const th = e.target.closest('th[data-sort]'); if (th){ const sk = msearch.trim() ? 'search' : state.tab, k = th.dataset.sort, cur = state.sort[sk]; state.sort[sk] = {k, dir: cur && cur.k === k ? -cur.dir : 1}; save(); render(); return; }
  const sh = e.target.closest('.sec-head'); if (sh){ const k = sh.dataset.sec; state.collapsed[k] = !state.collapsed[k]; save(); render(); return; }
  if (e.target.id === 'msclear'){ msearch = ''; document.getElementById('msearch').value = ''; render(); return; }
  const r = e.target.closest('.row'); if (r && !e.target.closest('select')){ const id = r.dataset.id; state.open[id] = !state.open[id]; render(); }
});
document.getElementById('msearch').addEventListener('input', e => { msearch = e.target.value; state.open = {}; render(); });
render();
boot();
