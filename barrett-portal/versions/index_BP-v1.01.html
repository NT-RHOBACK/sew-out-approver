<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Barrett Sew-Out Portal (demo)</title>
<style>
/* BP demo: same look as the Embroidery Portal (Admiral Navy, Old Glory Red, Futura PT headings, Aptos body). Sample data only. */
:root{--navy:#29304E;--red:#BF2033;--line:#E8ECF0;--bg:#FAFAFA;--text:#29304E;--grey:#6B7B8D;--lgrey:#9399A6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Aptos','Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
h1,.h2,.tab,.sec-head .name,.brand,.brand-sub,.box-hd,.pipe .lbl{font-family:"Futura PT",futura-pt,"Tw Cen MT","Century Gothic","Futura",sans-serif}
.header{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--navy)}
.ridge{display:flex;height:26px}.ridge span{width:4px}.ridge .r{background:var(--red)}.ridge .n{background:var(--navy)}
.brand-sub{font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--navy)}
.demo-tag{margin-left:auto;font-size:11px;font-weight:700;background:#fff4d6;border:1px solid #f0d58a;color:#7a5800;border-radius:6px;padding:3px 9px}
.vbadge{font-size:11px;color:var(--grey);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:14px 18px;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--navy)}.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab .cnt{font-size:11px;background:#eef1f6;border-radius:10px;padding:1px 7px;margin-left:6px;letter-spacing:0}
.page{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
h1{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
.sub{color:var(--grey);font-size:13px;margin-bottom:14px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 18px}
@media(max-width:800px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pipe .pbox{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:8px;text-align:center;padding:14px 8px;cursor:pointer}
.pipe .pbox.late{border-top-color:var(--red)}.pipe .pbox.up{border-top-color:#2E7D32}.pipe .pbox.ap{border-top-color:#6B7B8D}
.pipe .num{font-size:24px;font-weight:700;color:var(--navy)}
.pipe .lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey);margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--text)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.light{background:#fff;color:var(--navy);border:1px solid #cfd5df}.btn.small{padding:6px 10px;font-size:12px}
.sec{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;user-select:none}
.sec-head .chev{width:14px;color:var(--grey);font-size:11px}
.sec-head .name{font-size:18px;font-weight:700;color:var(--navy)}
.sec-head .cnt{font-size:11px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--grey)}
.sec-head .hint{font-size:12px;color:var(--grey)}
.tblwrap{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-x:auto;margin:4px 0 6px}
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);text-align:left;padding:14px 12px;border-bottom:2px solid var(--navy);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;white-space:nowrap}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#f6f8fb}.tbl tr.row.open td{background:#eef1f8}
.tbl .empty td{color:var(--grey);text-align:center;padding:18px}
.logo-n{font-weight:600}.rush{color:var(--red);font-weight:800;margin-right:4px}
.reqno{color:var(--grey);font-size:12px}
.dtp{display:inline-block;font-size:13px;font-weight:600;border-radius:5px;padding:3px 8px}
.dtp.plain{font-weight:400;color:var(--grey);padding-left:0}
.dtp.red{background:#f8d7d7;color:#a61b1b}.dtp.yellow{background:#fdf0c4;color:#7a5800}.dtp.nodate{background:#eef1f6;color:#6B7B8D}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:12px;padding:4px 10px;letter-spacing:.5px}
.pill.need{background:#fde2cf;color:#9a3412}.pill.up{background:#dcefdc;color:#1f6b2a}.pill.ap{background:#e6eaf2;color:#29304E}
.new-reply{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:2px 7px;margin-left:6px;letter-spacing:.5px}
.card td{background:#f7f8fb!important;padding:16px;white-space:normal;cursor:default}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.cgrid{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.box-hd{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.box-hd .num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}
.box-bd{padding:12px 14px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;font-size:13px}.kv .k{color:var(--grey)}
.urgent{color:var(--red);font-weight:700}
.fab{display:inline-block;font-size:12px;font-weight:700;border:1px solid #cfd5df;border-radius:6px;padding:3px 8px;background:#fff}.fab i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #9399A6;margin-right:5px;vertical-align:-1px}
.sewon{display:flex;align-items:center;gap:12px;background:#eef1f8;color:var(--navy);border:1px solid #cfd5df;border-left:6px solid var(--navy);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}.sewon b{font-size:20px;letter-spacing:.5px}.sewon i{width:30px;height:30px;border-radius:6px;border:1px solid #9399A6;display:inline-block;flex:none}
.files div{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;align-items:center;gap:8px}.files div:last-child{border-bottom:none}
.sew-this{background:#dcefdc;color:#1f6b2a;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.old{color:var(--lgrey)}
.note{font-size:12px;color:var(--grey);margin-top:6px}
.photo{display:inline-flex;align-items:center;justify-content:center;width:120px;height:90px;border-radius:8px;background:#2a2f45;color:#fff;font-size:11px;text-align:center;margin:6px 8px 0 0;vertical-align:top;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.hist{border:1px solid var(--line);border-radius:8px;margin-top:8px}
.hist-h{padding:8px 10px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.hist-b{padding:4px 10px 10px;font-size:13px;border-top:1px solid var(--line)}
.msg{border-left:3px solid var(--navy);background:#f7f8fb;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px}
.msg.b{border-left-color:#2E7D32}.msg .who{font-size:12px;color:var(--grey)}
textarea{width:100%;min-height:60px;border:1px solid #d6dbe4;border-radius:6px;padding:8px;font:inherit;font-size:13px;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.same{background:#fff;border:1px dashed #cfd5df;border-radius:10px;padding:30px;text-align:center;color:var(--grey)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:50}
</style>
</head>
<body>
<div class="header"><span class="brand">RHOBACK</span><span class="ridge"><span class="r"></span><span class="n"></span></span><span class="brand-sub">Barrett Sew-Out Portal</span>
  <span class="demo-tag">DEMO with sample data</span><span class="vbadge" id="ver"></span><span class="avatar">B</span></div>
<div class="tabs" id="tabs"></div>
<div class="page" id="page"></div>
<div class="toast" id="toast"></div>
<script>
const VERSION = 'BP v1.01';   // Barrett portal demo (sample data only, nothing is saved or sent)
document.getElementById('ver').textContent = VERSION;
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// business hours back from now (weekdays only), so the sample Late tags always look right
function bizAgo(h){ const t = new Date(); let left = h * 3600000; while (left > 0){ const w = t.getDay(), dayStart = new Date(t); dayStart.setHours(0, 0, 0, 0);
  if (w === 0 || w === 6){ t.setTime(dayStart.getTime() - 1); continue; } const can = t - dayStart; if (can >= left){ t.setTime(t.getTime() - left); left = 0; } else { left -= can; t.setTime(dayStart.getTime() - 1); } }
  if (t.getHours() < 8) t.setHours(9, 15); else if (t.getHours() > 17) t.setHours(16, 40); return t; }   // sample times during the work day
function bizHoursSince(d){ let ms = 0; const t = new Date(d), now = new Date(); while (t < now){ const end = new Date(t); end.setHours(24, 0, 0, 0); const stop = end < now ? end : now; const w = t.getDay(); if (w && w !== 6) ms += stop - t; t.setTime(stop); } return ms / 3600000; }
const daysOut = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
const fmtD = iso => { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return +m + '/' + +d + '/' + y.slice(2); };
const fmtDT = d => { const h = d.getHours(), ap = h < 12 ? 'AM' : 'PM'; return fmtD(isoOf(d)) + ' ' + (h % 12 || 12) + ':' + pad(d.getMinutes()) + ' ' + ap; };
const dayDiff = iso => { const a = new Date(iso + 'T00:00'), b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 86400000); };
const startCls = iso => { if (!iso) return ''; const n = dayDiff(iso); return n <= 30 ? 'red' : n <= 45 ? 'yellow' : 'plain'; };
const isRush = r => r.urgency.startsWith('URGENT') || (r.start && dayDiff(r.start) <= 30);
function lateLvl(r){ if (r.stage !== 'need') return ''; const h = bizHoursSince(r.sent); return isRush(r) ? (h >= 24 ? 'red' : '') : h >= 48 ? 'red' : h >= 24 ? 'yellow' : ''; }

// ---- sample data (made-up clubs and people) ----
const ANS = (urg, fab, sub, ord) => ({urgency:urg, fabric:fab, subs:sub, order:ord});
const SWATCH = {White:'#ffffff', Navy:'#1f2a4d', Khaki:'#c8b68a', Black:'#111111'};   // BP v1.01: fabric color swatches (Any = striped)
const swatch = f => SWATCH[f] ? 'background:' + SWATCH[f] : 'background:repeating-linear-gradient(45deg,#fff 0 4px,#cfd5df 4px 8px)';
const fabShort = f => /^Any/.test(f) ? 'Any color' : f;
const R = [
  Object.assign({id:'101', logo:'SampleHillsGC_TreeOnly_1.34w_v1', acct:'Sample Hills Golf Club', rep:'Rep A', start:'', sent:bizAgo(52), stage:'need',
    threads:'Tree: Madeira 1751 (green). Trunk: 1055 (brown).', notes:'Please sew out the logo with the new color card attached.',
    files:[{n:'SampleHillsGC_TreeOnly_1.34w_v1.DST', dst:true, use:true}, {n:'SampleHillsGC_TreeOnly_1.34w_v1.pdf'}, {n:'SOA_SampleHillsGC_TreeOnly_1.34w_v1.pdf'}],
    history:[{n:1, sent:bizAgo(120), photo:bizAgo(100), status:'Approved by Noelle Thompson', at:bizAgo(96), what:'All-white logo'}],
    msgs:[{by:'Noelle', at:bizAgo(52), t:'Sew-out request sent (sew-out 2): three colors this time, see the new color card.'}]}, ANS('None, just asap', 'Any, ensure thread colors are visible', 'Yes, can substitute thread colors if unavailable', 'Yes')),
  Object.assign({id:'126', logo:'MapleRidgeCC_Crest_2.30w_v1', acct:'Maple Ridge Country Club', rep:'Rep B', start:daysOut(18), sent:bizAgo(30), stage:'need',
    threads:'Shield: 1000 (black). Text: 1001 (white).', notes:'Rush: they need these for an event.',
    files:[{n:'MapleRidgeCC_Crest_2.30w_v1.DST', dst:true, use:true}, {n:'MapleRidgeCC_Crest_2.30w_v1.pdf'}],
    history:[], msgs:[]}, ANS('URGENT, Please prioritize', 'Navy', 'No, use the exact thread colors', 'No')),
  Object.assign({id:'153', logo:'LakeviewCC_Script_1.80w_v2', acct:'Lakeview Country Club', rep:'Rep C', start:daysOut(60), sent:bizAgo(26), stage:'need',
    threads:'Script: 1147 (gold).', notes:'Use v2. The v1 DST had the wrong size.',
    files:[{n:'LakeviewCC_Script_1.80w_v1.DST', dst:true}, {n:'LakeviewCC_Script_1.80w_v2.DST', dst:true, use:true}, {n:'LakeviewCC_Script_1.80w_v2.pdf'}, {n:'Lakeview logo.jpg'}],
    history:[], msgs:[{by:'Barrett', at:bizAgo(20), t:'Do you want this on white or navy?', reply:true}]}, ANS('None, just asap', 'White', 'Yes, can substitute thread colors if unavailable', 'No')),
  Object.assign({id:'160', logo:'OakBendGC_Flag_1.13w_v1', acct:'Oak Bend Golf Club', rep:'Rep A', start:daysOut(40), sent:bizAgo(6), stage:'need',
    threads:'Flag: 1747 (red). Pole: 1000 (black).', notes:'',
    files:[{n:'OakBendGC_Flag_1.13w_v1.DST', dst:true, use:true}, {n:'OakBendGC_Flag_1.13w_v1.pdf'}], history:[], msgs:[]}, ANS('None, just asap', 'Any, ensure thread colors are visible', 'Yes, can substitute thread colors if unavailable', 'Yes')),
  Object.assign({id:'163', logo:'PineValleyCC_Pinecones_1.50w_v1', acct:'Pine Valley Country Club', rep:'Rep B', start:'', sent:bizAgo(40), stage:'up', photo:bizAgo(8),
    threads:'Pinecones: 1059 (brown). Needles: 1751 (green).', notes:'',
    files:[{n:'PineValleyCC_Pinecones_1.50w_v1.DST', dst:true, use:true}, {n:'PineValleyCC_Pinecones_1.50w_v1.pdf'}], history:[], msgs:[]}, ANS('None, just asap', 'Khaki', 'Yes, can substitute thread colors if unavailable', 'No')),
  Object.assign({id:'165', logo:'HarborPointGC_Anchor_1.25h_v1', acct:'Harbor Point Golf Club', rep:'Rep C', start:daysOut(35), sent:bizAgo(60), stage:'up', photo:bizAgo(30),
    threads:'Anchor: 1043 (navy).', notes:'One color only.',
    files:[{n:'HarborPointGC_Anchor_1.25h_v1.DST', dst:true, use:true}], history:[], msgs:[]}, ANS('None, just asap', 'White', 'No, use the exact thread colors', 'No')),
  Object.assign({id:'140', logo:'CedarRunCC_Initials_1.00h_v1', acct:'Cedar Run Country Club', rep:'Rep A', start:daysOut(90), sent:bizAgo(90), stage:'ap', photo:bizAgo(70), approved:bizAgo(50),
    threads:'Initials: 1000 (black).', notes:'',
    files:[{n:'CedarRunCC_Initials_1.00h_v1.DST', dst:true, use:true}], history:[], msgs:[]}, ANS('None, just asap', 'Any, ensure thread colors are visible', 'Yes, can substitute thread colors if unavailable', 'No'))
];
const SECS = [['need', 'Needs sew-out', 'Sent to you, no sew-out photo yet. RUSH first, then the oldest first.'], ['up', 'Uploaded, waiting on review', 'You uploaded the photo. Noelle is reviewing it.'], ['ap', 'Approved', 'Recent sew-outs Noelle approved.']];
const STAGE_PILL = {need:'<span class="pill need">NEEDS SEW-OUT</span>', up:'<span class="pill up">UPLOADED</span>', ap:'<span class="pill ap">APPROVED</span>'};
let tab = 'req', q = '', openId = null, shut = {}, histOpen = {};
const TABS = [['ifs', 'Unshipped IFs'], ['req', 'Embroidery Requests'], ['err', 'Errors'], ['cost', 'Cost Analysis']];
function toast(t){ const el = document.getElementById('toast'); el.innerHTML = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2600); }
const order = (a, b) => (isRush(b) - isRush(a)) || (a.sent - b.sent);
function rowHtml(r){
  const lv = lateLvl(r), sc = startCls(r.start), newReply = r.msgs.some(m => m.reply && !m.done);
  return '<tr class="row' + (openId === r.id ? ' open' : '') + '" data-id="' + r.id + '"><td><span class="logo-n">' + (isRush(r) ? '<span class="rush" title="RUSH">R</span>' : '') + esc(r.logo) + '</span>' + (newReply ? '<span class="new-reply">NEW REPLY</span>' : '') + '<div class="reqno">Request #' + r.id + '</div></td>' +
    '<td>' + esc(r.acct) + '</td><td><span class="fab" title="' + esc(r.fabric) + '"><i style="' + swatch(r.fabric) + '"></i>' + esc(fabShort(r.fabric)) + '</span></td><td>' + (r.start ? '<span class="dtp ' + sc + '">' + fmtD(r.start) + '</span>' : '<span class="dtp nodate">No date</span>') + '</td>' +
    '<td>' + fmtDT(r.sent) + (lv ? ' <span class="dtp ' + lv + '">Late</span>' : '') + '</td>' +
    '<td>' + (r.photo ? '<span style="color:#2E7D32;font-weight:600">&#10003; ' + fmtDT(r.photo) + '</span>' : '<span style="color:#e0702a">Pending</span>') + '</td><td>' + STAGE_PILL[r.stage] + '</td></tr>' +
    (openId === r.id ? '<tr class="card"><td colspan="7">' + cardHtml(r) + '</td></tr>' : ''); }
function cardHtml(r){
  const a = '<div class="sewon"><i style="' + swatch(r.fabric) + '"></i><div>Sew on<br><b>' + esc(fabShort(r.fabric).toUpperCase()) + '</b>' + (/^Any/.test(r.fabric) ? '<div style="font-size:12px;opacity:.85">' + esc(r.fabric) + '</div>' : '') + '</div></div><div class="kv"><div class="k">Urgency</div><div' + (r.urgency.startsWith('URGENT') ? ' class="urgent"' : '') + '>' + esc(r.urgency) + '</div>' +
    '<div class="k">Fabric color</div><div>' + esc(r.fabric) + '</div><div class="k">Thread substitutions?</div><div>' + esc(r.subs) + '</div><div class="k">Order thread colors?</div><div>' + esc(r.order) + '</div>' +
    '<div class="k">Notes</div><div>' + (r.notes ? esc(r.notes) : '<span class="old">None</span>') + '</div><div class="k">Sent by</div><div>Noelle Thompson &middot; ' + fmtDT(r.sent) + '</div></div>';
  const th = '<div>' + esc(r.threads) + '</div><div class="note">From the logo&rsquo;s thread color notes. The color card is in the files too.</div>';
  const fl = '<div class="files">' + r.files.map(f => '<div>' + (f.dst ? '&#11088;' : '&#128196;') + ' <span' + (f.dst && !f.use ? ' class="old"' : '') + '>' + esc(f.n) + '</span>' + (f.use ? '<span class="sew-this">Sew this one</span>' : f.dst ? '<span class="old">(older version, don&rsquo;t sew)</span>' : '') + '</div>').join('') + '</div>';
  const up = r.stage === 'need' ? '<div>No sew-out photo yet.</div><div class="btns"><label class="btn">&#8679; Upload sew-out photo<input type="file" accept="image/*" data-up="' + r.id + '" style="display:none"></label></div><div class="note">Demo: the photo stays in this page only. In the real portal it goes to Noelle for review.</div>'
    : '<div><span class="photo">' + (r.photoUrl ? '<img src="' + r.photoUrl + '" alt="">' : 'Sew-out photo') + '</span></div><div class="note">Uploaded ' + fmtDT(r.photo) + ' by Barrett' + (r.stage === 'ap' ? ' &middot; Approved ' + fmtDT(r.approved) : ' &middot; waiting on Noelle&rsquo;s review') + '</div>' +
      (r.stage === 'up' ? '<div class="btns"><label class="btn light small">Re-upload<input type="file" accept="image/*" data-up="' + r.id + '" style="display:none"></label></div><div class="note">A re-upload keeps the first photo, marked &ldquo;Replaced&rdquo;.</div>' : '') +
      (r.replaced || []).map(p => '<div class="note old">Replaced photo &middot; uploaded ' + fmtDT(p) + '</div>').join('');
  const hist = r.history.length ? r.history.map(h => { const k = r.id + '|' + h.n, o = histOpen[k];
    return '<div class="hist"><div class="hist-h" data-hist="' + k + '">' + (o ? '&#9662;' : '&#9656;') + ' <b>Sew-out ' + h.n + '</b> <span class="old">' + esc(h.what) + ' &middot; sent ' + fmtDT(h.sent) + '</span></div>' +
      (o ? '<div class="hist-b">Sent ' + fmtDT(h.sent) + '<br>Photo uploaded ' + fmtDT(h.photo) + '<br>' + esc(h.status) + ' &middot; ' + fmtDT(h.at) + '<div><span class="photo">Sew-out ' + h.n + ' photo</span></div></div>' : '') + '</div>'; }).join('') : '<div class="old">This is the first sew-out for this logo.</div>';
  const msgs = (r.msgs.length ? r.msgs.map((m, i) => '<div class="msg' + (m.by === 'Barrett' ? ' b' : '') + '"><div class="who"><b>' + (m.by === 'Barrett' ? 'Barrett' : 'Noelle Thompson') + '</b> &middot; ' + fmtDT(m.at) + '</div>' + esc(m.t) + '</div>').join('') : '<div class="old">No messages yet.</div>') +
    '<textarea data-msg="' + r.id + '" placeholder="Message to Noelle (questions, waiting on thread colors, etc.)"></textarea><div class="btns"><button class="btn small" data-send="' + r.id + '">Send to Noelle</button></div><div class="note">Sales reps never see these messages.</div>';
  return '<div class="cgrid"><div>' + box(1, 'Sew-out request #' + r.id, a) + '<div style="height:14px"></div>' + box(2, 'Thread colors', th) + '<div style="height:14px"></div>' + box(3, 'Files', fl) + '</div>' +
    '<div>' + box(4, 'Sew-out photo', up) + '<div style="height:14px"></div>' + box(5, 'Earlier sew-outs', hist) + '<div style="height:14px"></div>' + box(6, 'Messages with Noelle', msgs) + '</div></div>'; }
const box = (n, t, b) => '<div class="box"><div class="box-hd"><span class="num">' + n + '</span>' + esc(t) + '</div><div class="box-bd">' + b + '</div></div>';
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(([k, t]) => '<button class="tab' + (tab === k ? ' on' : '') + '" data-tab="' + k + '">' + t + (k === 'req' ? '<span class="cnt">' + R.filter(r => r.stage !== 'ap').length + '</span>' : '') + '</button>').join('');
  const P = document.getElementById('page');
  if (tab !== 'req'){ P.innerHTML = '<h1>' + TABS.find(x => x[0] === tab)[1] + '</h1><div class="same">This tab keeps working the same way it does now (only the look changes to match).</div>'; return; }
  const list = R.filter(r => !q || (r.logo + ' ' + r.acct + ' #' + r.id).toLowerCase().includes(q.toLowerCase()));
  const n = s => R.filter(r => r.stage === s).length, late = R.filter(r => lateLvl(r)).length;
  P.innerHTML = '<h1>Embroidery Requests</h1><div class="sub">Sew-outs Noelle sent you. Click a row to see the request, thread colors, files, upload the photo, or message Noelle.</div>' +
    '<div class="pipe"><div class="pbox" data-jump="need"><div class="num">' + n('need') + '</div><div class="lbl">Needs sew-out</div></div><div class="pbox late" data-jump="need"><div class="num" style="color:var(--red)">' + late + '</div><div class="lbl">Late</div></div>' +
    '<div class="pbox up" data-jump="up"><div class="num">' + n('up') + '</div><div class="lbl">Uploaded, waiting on review</div></div><div class="pbox ap" data-jump="ap"><div class="num">' + n('ap') + '</div><div class="lbl">Approved</div></div></div>' +
    '<div class="bar"><input id="q" placeholder="Search logo, account, or request #&hellip;" value="' + esc(q) + '"><button class="btn light" id="clear">Clear</button></div>' +
    SECS.map(([k, name, hint]) => { const rows = list.filter(r => r.stage === k).sort(order);
      return '<div class="sec" id="sec-' + k + '"><div class="sec-head" data-sec="' + k + '"><span class="chev">' + (shut[k] ? '&#9656;' : '&#9662;') + '</span><span class="name">' + name + '</span><span class="cnt">' + rows.length + '</span><span class="hint">' + hint + '</span></div>' +
        (shut[k] ? '' : '<div class="tblwrap"><table class="tbl"><tr><th>Logo</th><th>Account</th><th>Fabric</th><th>Start Date</th><th>Sent to Barrett</th><th>Sew-out photo</th><th>Status</th></tr>' +
          (rows.length ? rows.map(rowHtml).join('') : '<tr class="empty"><td colspan="7">Nothing here.</td></tr>') + '</table></div>') + '</div>'; }).join('');
  const qi = document.getElementById('q'); qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n2 = document.getElementById('q'); n2.focus(); n2.setSelectionRange(pos, pos); };
  document.getElementById('clear').onclick = () => { q = ''; render(); };
  document.querySelectorAll('[data-up]').forEach(inp => inp.onchange = () => { const r = R.find(x => x.id === inp.dataset.up), f = inp.files[0]; if (!f) return;
    if (r.photo){ (r.replaced = r.replaced || []).push(r.photo); } r.photoUrl = URL.createObjectURL(f); r.photo = new Date(); r.stage = 'up'; render(); toast('Sew-out photo uploaded. Moved to Uploaded, waiting on review.'); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t){ tab = t.dataset.tab; render(); return; }
  const s = e.target.closest('[data-sec]'); if (s){ shut[s.dataset.sec] = !shut[s.dataset.sec]; render(); return; }
  const j = e.target.closest('[data-jump]'); if (j){ shut[j.dataset.jump] = false; render(); document.getElementById('sec-' + j.dataset.jump).scrollIntoView({behavior:'smooth'}); return; }
  const h = e.target.closest('[data-hist]'); if (h){ histOpen[h.dataset.hist] = !histOpen[h.dataset.hist]; render(); return; }
  const sd = e.target.closest('[data-send]'); if (sd){ const r = R.find(x => x.id === sd.dataset.send), ta = document.querySelector('[data-msg="' + r.id + '"]'), v = ta.value.trim(); if (!v) return; r.msgs.push({by:'Barrett', at:new Date(), t:v}); render(); toast('Sent to Noelle (demo: nothing is really sent).'); return; }
  const row = e.target.closest('tr.row'); if (row){ openId = openId === row.dataset.id ? null : row.dataset.id; render(); }
});
render();
</script>
</body>
</html>
